  rust_note: "src/lint/chamfers.rs: chamfer.length per chamfer feature, judged by the claiming annotation's printed text. The callout form is draftwright's (C<leg> for legs within 0.05 mm at 45° within 0.5°, else <leg> × <angle>°); for the second form the text must print the angle too, which Python's lint, following the measurement identity alone, does not check. On the 12 captured sheets the bridge reads, every chamfer agrees with Python (coverage_on_pythons_sheets_matches_pythons_lint_or_is_known). quiddity's OrientedChamfer is not judged, as in Python."
