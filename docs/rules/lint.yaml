# ---------------------------------------------------------------------------------------
# Coarse coverage checks (coverage.py)
# ---------------------------------------------------------------------------------------

- id: LINT-code-feature_not_dimensioned
  statement: "Every recognised cylindrical diameter on the part (bore, counterbore/spotface step, boss) has a diameter callout on the sheet."
  detail: "Match tolerance 0.15 mm. Radius callouts do not count (an 'R5 TYP' note would mask an undimensioned bore); title blocks are skipped; structured callouts are not parsed as text (BCD suffixes are not feature coverage); diameters dropped by the callout cap are excluded; a boss diameter owned by a blend of the same face is excluded. Partial cylinders (slot ends, interrupted recesses) are not in the inventory."
  class: drafting
  source:
    lint_code: "feature_not_dimensioned"
    module: "linting/coverage.py"
    issues: [80, 92, 1351, 1450]
    tests: [tests/test_lint_coverage.py, tests/test_diameter_leaders.py, tests/test_issue_1505_diameter_coverage.py]
  status: pending
  port_note: "Keep as a coarse backstop to the semantic ledgers."

- id: LINT-code-feature_count_mismatch
  statement: "For each hole diameter, the quantities stated by structured callouts account for every physical occurrence on the part."
  detail: "Each bore, counterbore and spotface occurrence counts one. Fires only when 0 < stated < required. A diameter covered by free text is exempt (text carries no count). Several representations of one owner are unioned, not summed. Disabled when the semantic hole ledger owns counts (Drawing.lint)."
  class: drafting
  source:
    lint_code: "feature_count_mismatch"
    module: "linting/coverage.py"
    issues: [92]
    tests: [tests/test_hole_pattern_callouts.py, tests/test_hole_table.py]
  status: pending
  port_note: "Keep only if a standalone coarse check is wanted; the hole ledger supersedes it."

- id: LINT-code-feature_no_centermark
  statement: "Every hole, including each pattern member, has a centre mark in the view looking along its axis."
  detail: "Centre within 0.6 mm of the projected hole centre; Y-axis holes may use front or rear. One aggregated finding with the count of unmarked holes. Double-D bores included."
  class: drafting
  source:
    lint_code: "feature_no_centermark"
    module: "linting/coverage.py"
    issues: [218]
    tests: [tests/test_issue_1143_hole_completeness.py, tests/test_e2e_slice.py]
  status: pending
  port_note: "Keep."

- id: LINT-code-feature_not_located
  statement: "Every hole that is not part of a pattern and not on the part's centre/turning axis has a locating dimension on each perpendicular axis where it is off-centre."
  detail: "An axis needs locating only if the hole is more than 1.0 mm from the part bbox centre on it. Pattern members are exempt (located by BCD/pitch). Evidence is a structured location fact for that feature and axis, a location note, or a dimension witness aligned within 0.6 mm; structured evidence, when present, is authoritative over coincident geometry."
  class: drafting
  source:
    lint_code: "feature_not_located"
    module: "linting/coverage.py"
    issues: [218, 93]
    tests: [tests/test_issue_1143_hole_completeness.py, tests/test_interior_label_placement.py]
  status: pending
  port_note: "Keep."

- id: LINT-code-unrecognised_defining_geometry-principal_profile
  statement: "Every inner opening and the outer boundary on a principal face is a profile the drawing vocabulary can dimension (circle, axis-aligned rectangle, obround, double-D), or it is flagged as undefined geometry."
  detail: "Passages and prismatic pockets that exactly match the opening are reported by their own unsupported codes instead. An outer boundary with N equal, evenly spaced arcs on one circle is reported with that count (no gear standard inferred)."
  class: drafting
  source:
    lint_code: "unrecognised_defining_geometry"
    module: "linting/coverage.py"
    issues: [1058, 1245, 1246]
    tests: [tests/test_issue_1058_wheel_profile.py, tests/test_issue_1245_passage_disposition.py]
  status: pending
  port_note: "Keep: independent B-rep scan for undimensionable profiles."

- id: LINT-code-unrecognised_defining_geometry-prismatic
  statement: "Bounded blind recesses and stepped or slanted profile transitions present in the geometry are represented by drawing features, or flagged as undefined geometry."
  detail: "Transitions are checked only when there are two or more shoulder stations (a lone transition may be owned by a plate-thickness scheme); channel walls and X/Y through-step bends count as owners."
  class: drafting
  source:
    lint_code: "unrecognised_defining_geometry"
    module: "linting/coverage.py"
    issues: [885]
    tests: [tests/test_issue_885_prismatic_coverage.py, tests/test_declared_recognition_gate.py]
  status: pending
  port_note: "Keep."

- id: LINT-code-pad_footprint_not_defined
  statement: "Every rectangular raised pad has its footprint length and width, its height above the attachment face, and its in-plane location dimensioned."
  detail: "Non-Z pads require structured evidence for pad_width, pad_length, pad_height and both location axes. Legacy Z pads may use geometric witnesses; a pad edge coincident with the part edge counts as located. One aggregated warning with the count."
  class: drafting
  source:
    lint_code: "pad_footprint_not_defined"
    module: "linting/coverage.py"
    issues: [885]
    tests: [tests/test_issue_885_prismatic_coverage.py, tests/test_issue_1351_structured_note_coverage.py]
  status: pending
  port_note: "Keep (or fold into the pad ledger)."

- id: LINT-code-pocket_not_located
  statement: "Every lone blind pocket has a complete in-plane location scheme."
  detail: "Per axis the pocket is located if it is symmetric about the part centre (within 1.0 mm), coincident with the datum edge, or a dimension spans from the datum (bbox minimum) to it. Edge-anchored pockets and pattern-located pockets are exempt; a pocket starting at the datum needs no long-axis centre dimension."
  class: drafting
  source:
    lint_code: "pocket_not_located"
    module: "linting/coverage.py"
    issues: [885]
    tests: [tests/test_issue_885_prismatic_coverage.py, tests/test_issue_1485_rounded_pockets.py]
  status: pending
  port_note: "Keep (or fold into the pocket ledger)."

- id: LINT-code-axial_length_missing
  statement: "A turned profile with n axial steps has all n step lengths dimensioned so every shoulder is located."
  detail: "Counted from profile-view dimensions whose witnesses sit on both shoulders, verified schedule cells or structured notes matched by axial span. A rendered groove-width callout covers its band. Each body-local profile is judged independently. Suppressed when the chain drop was already reported and the overall axial extent is dimensioned."
  class: drafting
  source:
    lint_code: "axial_length_missing"
    module: "linting/coverage.py"
    issues: [223, 443, 1357]
    tests: [tests/test_axial_dimensions.py, tests/test_issue_443_grm03_axial_coverage.py]
  status: pending
  port_note: "Keep."

- id: LINT-code-boss_height_missing
  statement: "Every boss with a modelled height has its height stated by a linear dimension; a diameter callout does not cover it."
  detail: "Covered by a Dimension annotation, verified cell or structured note for boss_height. A height consolidated onto an overall extent counts only once that extent is verifiably placed; a suppression that hands the fact to nobody is reported."
  class: drafting
  source:
    lint_code: "boss_height_missing"
    module: "linting/coverage.py"
    issues: [632, 1154, 964]
    tests: [tests/test_issue_1154_one_owner_per_measurement.py, tests/test_issue_1511_turned_boss_heights.py]
  status: pending
  rust_test: a_boss_states_its_height_by_a_dimension
  rust_note: "Partial (src/lint/bosses.rs): each boss whose record gives a height must have boss_height.length claimed by an annotation that prints it; a boss that shares a face with a groove of its diameter (within 0.15 mm) is the groove's floor and not judged (draftwright's boss_groove_owner). The port reports one boss_height_missing per boss, naming it, where Python reports one finding counting them. Not ported: a height consolidated onto an overall extent (the omission's conveyed_by lives in the plan), bosses absorbed into blends or turned steps by recognition ownership, and the assembly severity."
  port_note: "Keep."

- id: LINT-code-turned_profile_not_spanned
  statement: "The declared steps of a turned profile describe the whole axial length of the body; any undescribed stretch is reported."
  detail: "Warning. Only run for a caller-declared model (scoping choice, not immunity of the detection path). Hints that external cylinders on a prismatic part should be bosses."
  class: drafting
  source:
    lint_code: "turned_profile_not_spanned"
    module: "linting/coverage.py"
    issues: [631, 1132]
    tests: [tests/test_issue_1132_turned_profile_span_is_reported.py]
  status: pending
  port_note: "Keep."

- id: LINT-code-declared_feature_absent
  statement: "Every declared hole, boss or turned step corresponds to real geometry in the part, so no callout or centre mark points at solid material."
  detail: "Match: same axis, diameter within 0.2 mm, in-plane position within 0.5 mm, and correct polarity (hole = bore, boss/step = external). Declared double-D bores must match a through double-D profile. Warning; declared models only. Fidelity code."
  class: drafting
  source:
    lint_code: "declared_feature_absent"
    module: "linting/coverage.py"
    issues: [487]
    tests: [tests/test_lint_reconciliation.py, tests/test_issue_1176_quality_fidelity.py]
  status: pending
  port_note: "Keep for declared (script) models."

- id: LINT-coverage-coverage_state
  statement: "The annotation passes record which callouts document hole patterns, which holes those cover, which scattered hole docs a table may replace, and which diameters/profiles the callout cap dropped."
  class: machinery
  source:
    module: "linting/coverage.py"
    issues: [138, 351, 647, 720]
  status: pending
  port_note: "Drop: side channel; derive from the plan/registry in Rust."

- id: LINT-coverage-examinable_declared_kinds
  statement: "The declared feature kinds that a truth check can examine against geometry are hole, boss, step and external spur gear."
  class: machinery
  source:
