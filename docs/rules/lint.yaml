- id: LINT-hole_coverage-thread_and_profile
  statement: "A threaded hole states its thread depth, and a profiled (double-D) bore states its across-flats size, as part of the hole's requirements."
  detail: "HoleFeature.parameters adds thread.depth when a thread is present and profile_across_flats.length for a profiled bore; hole_coverage takes the feature's full parameter list as the requirement vocabulary."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143, 1061]
    tests: [tests/test_issue_1370_double_d_completeness_evidence.py]
  status: pending
  port_note: "Keep: derive requirements from the feature's parameter list."

- id: LINT-hole_coverage-grouping_count
  statement: "A group of more than one identical hole states its quantity (n×), and the stated quantity equals the number of physical holes in the group."
  detail: "Synthetic requirement grouping.count. When one grouped callout covers several features, the printed total must agree with the per-feature allocations or no count is credited."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143, 92]
    tests: [tests/test_issue_1369_hole_completeness_evidence.py, tests/test_issue_1370_hole_pattern_completeness_evidence.py]
  status: ported
  rust_test: holes_drilled_from_opposite_faces_are_separate_groups
  rust_note: "Stated as n× on the diameter's callout, n the group's size. The groups are the recognised patterns (Analysis.recognition.patterns) that bridge::holes::established_with accepts, and loose holes of one machining requirement. As in Python, a pattern is refused (its holes fall back to loose holes) only when its plane is oblique, its members share an axis line, or it is a bolt circle of fewer than five holes with nothing on its centre; a grid or linear pattern is one group however spaced (an_oblique_or_coaxial_pattern_is_not_established, recognised_patterns_are_the_groups). The port's dimensions also decline a grid that is not a lattice, or a linear pattern not evenly spaced, in its view, which Python's do not, so on such a part lint (with Python) expects the pattern's own count where the port's drawing may count it with other identical holes. An Analysis without a recognition record falls back to the fingerprints' pattern count and pitch, which cannot tell identical patterns apart (identical_patterns_are_grouped_as_recognised)."
  port_note: "Keep."

- id: LINT-hole_coverage-location
  statement: "Every hole is located from the datum in both directions perpendicular to its axis, and every member of a group is located."
  detail: "Z-axis holes: location.location.x and .y; off-axis holes: the in-plane coordinate and z (location_off_axis.*). Location requires every separately declared physical member to be tied to a placed location mark; per-axis requirements are counted independently (2 per hole). Through holes ignore their along-axis coordinate."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143, 883]
    tests: [tests/test_issue_1369_hole_completeness_evidence.py, tests/test_issue_1219_location_claims_its_own_axis.py]
  status: pending
  port_note: "Keep."

- id: LINT-hole_coverage-turned_axis_location
  statement: "A cross hole lying on a turned part's axis is located along that axis by its centreline, and a centre mark in the hole's end-on view counts as locating it."
  detail: "Recorded as two requirements (location_off_axis.centerline.<in-plane> and .centerline.z) so the denominator does not shrink; the turned axis is recovered from external cylinders supporting the turned-step ladder (unique best support)."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143]
    tests: [tests/test_issue_1143_hole_completeness.py]
  status: pending
  port_note: "Keep."

- id: LINT-hole_coverage-pattern_location
  statement: "A bolt circle, or a grid whose members prove a centred lattice, is located by its centre; a linear pattern or non-centred grid is located by one physical member, with pitch locating the rest."
  detail: "Parameters location_pattern.location.<in-plane axes>. Grid centre is credited only when every member matches its lattice site within 0.01 mm."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143]
    tests: [tests/test_issue_1370_hole_pattern_completeness_evidence.py]
  status: pending
  port_note: "Keep."

- id: LINT-hole_coverage-pattern_spacing
  statement: "A hole pattern states its spacing: bolt-circle diameter for a bolt circle, pitch for a linear array, and row and column pitch for a rectangular grid."
  detail: "From PatternFeature.parameters: bolt_circle diameter, pitch.length, grid_pitch row/col. Recognition-side count: grid adds 2 requirements, others 1."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143]
    tests: [tests/test_issue_1370_hole_pattern_completeness_evidence.py]
  status: pending
  port_note: "Keep."

- id: LINT-hole_coverage-opposed_bores_distinct
  statement: "Holes drilled from opposite faces, or along different oblique directions, are separate machining requirements even when every printed size matches."
  detail: "Loose holes are grouped by spec plus signed axis; blind holes keep their axial coordinate in their identity, through holes do not."
  class: drafting
  source:
    module: "linting/hole_coverage.py"
    issues: [1223, 1229]
    tests: [tests/test_issue_1369_hole_completeness_evidence.py]
  status: ported
  rust_test: holes_drilled_from_opposite_faces_are_separate_groups
  port_note: "Keep: group holes by spec and signed axis."

- id: LINT-hole_coverage-requirement_count
  statement: "An unjoined hole source counts its physical requirements as: diameter plus THRU-or-depth, two per counterbore, spotface or countersink, one for quantity when grouped, two datum locations, and one (linear/bolt circle) or two (grid) pattern spacings."
  class: trust
  source:
    lint_code: "hole_requirement_unverifiable"
    module: "linting/hole_coverage.py"
    issues: [1143]
    tests: [tests/test_issue_1143_hole_completeness.py]
  status: pending
  port_note: "Keep."

- id: LINT-hole_coverage-ownership_join
  statement: "Recognised holes are joined to declared hole features by an exact cover of their opening positions; a blind declaration may instead be matched at its cutter centre only when exactly one source and one remaining feature are left."
  detail: "Any overlap, partial or doubly-claimed owner fails closed as unverifiable."
  class: trust
  source:
    lint_code: "hole_requirement_unverifiable"
    module: "linting/hole_coverage.py"
    issues: [1143, 1217]
    tests: [tests/test_issue_1369_hole_completeness_evidence.py]
  status: pending
  port_note: "Keep the fail-closed principle; the exact algorithm may be simplified."

- id: LINT-hole_coverage-bolt_circle_corroboration
  statement: "A recognised bolt circle is treated as a pattern requirement only when it is physically corroborated or exactly declared; refused patterns fall back to individual holes."
  class: trust
  source:
    module: "linting/hole_coverage.py"
    issues: [1143]
    tests: [tests/test_issue_1370_hole_pattern_completeness_evidence.py]
  status: ported
  rust_test: a_small_bolt_circle_needs_something_round_on_its_centre
  rust_note: "bridge::holes::established_with, shared with the dimensions: a bolt circle of five or more holes is a group; one of fewer is a group only when a hole that is not a member, or a boss, has its axis parallel to the members' and within 0.5 mm of quiddity's fitted centre (draftwright's _BC_CONCENTRIC_TOL); otherwise its holes fall back to loose holes (recognised_patterns_are_the_groups). The port requires the witness's axis to be parallel, where draftwright compares the axes' dominant letters, so an oblique hole whose largest component matches does not corroborate here. Exact declarations do not apply: there are no declared builds (a maintainer decision; ADR R4, ADR4-3)."
  port_note: "Keep."

- id: LINT-hole_coverage-second_countersink_unverifiable
  statement: "A second countersink seat on the opposite face of a hole is a real requirement (diameter and angle) but is reported unverifiable because it cannot be attributed to a specific hole."
