# Rules catalogue: drafting knowledge encoded in draftwright's linting package.
# Source: pzfreo/draftwright origin/main @ 586628b96db6779454d499c7d92d37f1aa8f1df9
#   src/draftwright/linting/ (read via git show; nothing checked out).
# Where a coverage module derives its required parameters from an IR feature's parameters(),
# the parameter vocabulary was read from src/draftwright/model/ir.py / ir_foundation.py and
# is cited in the entry's detail.
#
# class:
#   drafting  - what a complete/correct drawing must state or how it must be laid out
#   trust     - evidence/provenance rules: what counts as proof that a requirement is met,
#               and how unprovable cases are reported (fail closed)
#   machinery - Python implementation plumbing (registries, orchestration, caches)
#
# Common conventions of the *_coverage modules (see LINT-_parameter_coverage-* entries):
#   - every recognised physical requirement resolves to one outcome state: placed,
#     satisfied_by_structured_note, suppressed, dropped, missing, unverifiable
#     (plus inapplicable / unsupported in a few families);
#   - the lint code is "<family>_requirement_<state>" for suppressed/missing/unverifiable;
#     placed, satisfied and dropped states emit nothing (drops are already reported);
#   - severity is "info" on a multi-solid part (assembly / GA drawing), else "warning".

# ---------------------------------------------------------------------------------------
# Shared requirement-outcome conventions
# ---------------------------------------------------------------------------------------

- id: LINT-_parameter_coverage-outcome_states
  statement: "Every recognised physical requirement of a feature resolves to exactly one outcome: placed on the sheet, satisfied by a structured note, deliberately suppressed by the author, dropped during placement, missing, or unverifiable."
  detail: "Precedence is placed > satisfied_by_structured_note > suppressed > dropped > unverifiable/missing. 'unverifiable' is chosen over 'missing' when the feature owns an annotation whose measurement provenance cannot be read. Some families add 'inapplicable' (intrinsic exclusion, e.g. a location coincident with a datum) and 'unsupported' (recognised geometry with no drafting grammar)."
  class: trust
  source:
    module: "linting/_coverage_common.py, linting/_parameter_coverage.py"
    issues: [1018, 1351]
    tests: [tests/test_lint_coverage_common.py]
  status: pending
  port_note: "Keep: one shared outcome enum and resolver used by every family ledger."

- id: LINT-_parameter_coverage-report_uncovered_only
  statement: "Coverage lint reports only requirements that are suppressed, missing or unverifiable; a placed, note-satisfied or dropped requirement produces no coverage finding."
  detail: "Dropped requirements are not re-reported because the placement stage already emitted a specific *_dropped issue; reporting both would double-count one defect. Messages: suppressed='was deliberately omitted by the authored dimension set', missing='has no placed, suppressed, or dropped callout outcome', unverifiable='cannot be joined to measurement provenance without guessing'."
  class: trust
  source:
    module: "linting/_parameter_coverage.py"
    tests: [tests/test_lint_coverage_common.py]
  status: pending
  port_note: "Keep: emit '<family>_requirement_<state>' codes from the outcome ledger."

- id: LINT-_coverage_common-assembly_severity
  statement: "Missing-feature coverage findings on a multi-body (general-arrangement) drawing are informational, because a GA deliberately omits each part's detail dimensions; on a single-part drawing they are warnings."
  detail: "assembly=None auto-detects: len(part.solids()) > 1 means assembly. Applies to feature_not_dimensioned, feature_count_mismatch, feature_no_centermark, feature_not_located, axial_length_missing, boss_height_missing, pad_footprint_not_defined, pocket_not_located, unrecognised_defining_geometry and every *_requirement_* family code."
  class: drafting
  source:
    module: "linting/coverage.py"
    issues: [69]
    tests: [tests/test_lint_coverage.py]
  status: pending
  port_note: "Keep: severity switch keyed on drawing kind (part vs assembly)."

- id: LINT-_coverage_common-exact_correspondence
  statement: "A recognised feature is matched to its drawing feature only by exact retained geometry; labels, annotation names, views and page coordinates are never correspondence evidence, and an ambiguous or duplicate match is unverifiable rather than guessed."
  detail: "Each family defines a key (axis, rounded location, sizes, orientation) used identically on the recognition record and the IR feature; a key is accepted only when exactly one source and one feature share it. Rounding is to 0.001 mm (the generated script's precision)."
  class: trust
  source:
    module: "linting/_parameter_coverage.py"
    issues: [1374, 1382, 1421]
    tests: [tests/test_lint_coverage_common.py]
  status: retired
  why: "Rules assessment 2026-10-11: features are joined by ID, which makes the correspondence exact by construction."
  port_note: "Keep: exact-key join with fail-closed ambiguity; do not port proximity matching."

- id: LINT-issues-unjoined_requirement_count
  statement: "When a recognised feature matches no drawing feature, all of its physical requirements are reported together as one unverifiable outcome that states how many requirements it stands for."
  detail: "parameter_id is the sentinel '?' and requirement_count carries the cardinality; the message names 'all N physical measurements, which no IR feature claimed' (or 'of unknown number' when the inventory is corrupt). Fixes the old 'requirement ? cannot be joined' message."
  class: trust
  source:
    module: "linting/issues.py"
    issues: [1397]
    tests: [tests/test_issue_1397_unverifiable_requirement_message.py]
  status: retired
  why: "Rules assessment 2026-10-11: lint joins by ID, so there is no unjoined feature to count."
  port_note: "Keep: unjoined outcome with explicit requirement count."

- id: LINT-_registry-structured_note_satisfaction
  statement: "A placed note satisfies a dimensional requirement only when it carries explicit measurement-identity provenance for that exact feature and parameter; note prose is never parsed for coverage."
  detail: "Structured-note authority is narrower than a placed callout: for holes, synthetic THRU and count facts cannot be satisfied by a note, while the public 'location' unit can satisfy component location axes."
  class: trust
  source:
    module: "linting/_registry.py, linting/hole_coverage.py"
    issues: [1351]
    tests: [tests/test_issue_1351_structured_note_coverage.py]
  status: pending
  rust_test: tests/dims_blends.rs::a_general_radius_note_can_be_hidden_and_moved_without_borrowing_prose_credit
  rust_note: "Stage G3 revives this rule for automatic radius notes: a note satisfies a radius only through explicit satisfies claims, never prose. Authored structured notes still carry no satisfaction claims."
  port_note: "Keep: satisfaction by typed identity only."

- id: LINT-schedule_evidence-verified_cells
  statement: "A table or schedule cell counts as evidence for a requirement only when its rendered content agrees with the compiler-approved measurement for that row and column."
  detail: "Unverified or stale cells cannot restore hole requirements, locations or counts; cells are checked including tolerances, THRU/blind content and quantity."
  class: trust
  source:
    module: "linting/schedule_evidence.py, linting/evidence.py"
    issues: [1543]
    tests: [tests/test_issue_1543_schedule_requirements.py, tests/test_issue_1543_feature_schedules.py]
  status: pending
  port_note: "Keep: verify cell content before crediting schedule evidence."

- id: LINT-issues-placement_drop_stage
  statement: "An issue counts as a placement drop (a valid annotation that did not fit) when its outcome stage is 'placement', or, absent a stage, when its code ends in '_dropped'; a 'validation' stage means malformed input, not a layout failure."
  class: trust
  source:
    module: "linting/issues.py"
    issues: [1127]
    tests: [tests/test_quality_components.py]
  status: retired
  why: "Rules assessment 2026-10-11: placement drops nothing, and problems carry explicit codes rather than a stage inferred from a suffix."
  port_note: "Keep: carry an explicit outcome stage on drop issues; avoid suffix inference in Rust."

- id: LINT-issues-lintissue_schema
  statement: "A lint finding carries severity, message, optional page location, stable code, fix suggestion, implicated measurement ids, source (AP242) ids, outcome stage, hole requirement ids, measurement spans, annotation name, view, evidence reason and related annotation names."
  class: machinery
  source:
    module: "linting/issues.py"
    issues: [29, 623, 1018, 1127, 1711]
  status: pending
  rust_test: review_finds_the_plates_holes_stated_by_its_own_callout
  rust_note: "lint::LintIssue: id, code, severity, message, at (page), view, subjects, requirements (hole_requirement_ids), measurements, sources, stage, annotation, related, evidence (evidence_reason), fix (suggestion, in words). Pending: measurement spans are not carried (the port's measurement IDs are per feature and parameter; whether spans are needed is undetermined), and the rust_test checks code, requirement, subjects and fix only, not the schema's other fields."
  port_note: "Adapt: define a Rust LintIssue struct with the same stable fields."

- id: LINT-issues-pair_aggregation_ledger
  statement: "Pairwise layout findings record an opaque subject token per summary run so a score can group pair findings without changing the public issue list."
  class: machinery
  source:
    module: "linting/issues.py"
    issues: [1147]
  status: pending
  port_note: "Adapt or drop: only needed if the Rust quality score aggregates pair findings."

- id: LINT-_registry-requirement_carriers
  statement: "Each requirement outcome retains the names of the annotations (measurement, structured note, physical location, schedule cell) that carried it."
  class: machinery
  source:
    module: "linting/_registry.py"
  status: pending
  port_note: "Adapt: keep carrier provenance on outcomes for reports."

- id: LINT-requirements-source_families
  statement: "Physical requirement ledgers exist for section recesses, chamfers, blends, bosses, channels, circular blind steps, fillets, paired ramp steps, through steps, turned steps, flats, grooves, gusset ribs, holes, hole patterns, oriented slots, pads, plates, polygonal bosses, polygonal stock, pockets, pocket patterns, rectangular blind slots, round-bottom blind slots, slots, slot patterns and outer-profile angles."
  detail: "Records absorbed by another family's grammar are excluded (section recess owned by a channel step level; turned step owned by a groove); an unexpectedly-missing section recess has no grammar and earns no credit."
  class: machinery
  source:
    module: "linting/requirements.py"
    tests: [tests/test_document_report.py]
  status: pending
  port_note: "Adapt: single collector of family ledgers shared by lint and reports."

