[package]
name = "draftwright"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Automated technical drawings from STEP B-rep: a Rust port of draftwright."

[dependencies]
chrono = { version = "0.4", default-features = false }
dxf = { version = "0.6.2", features = ["serialize"] }
flate2 = "1.1.10"
haecceity = { git = "https://github.com/pzfreo/quiddity-rust", branch = "prototype/rust-port" }
pdf-writer = "0.15"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
ttf-parser = "0.25.1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
flate2 = "1.1.10"
serde_json = "1.0.151"
