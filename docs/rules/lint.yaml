- id: LINT-hole_coverage-thread_and_profile
  statement: "A threaded hole states its thread depth, and a profiled (double-D) bore states its across-flats size, as part of the hole's requirements."
  detail: "HoleFeature.parameters adds thread.depth when a thread is present and profile_across_flats.length for a profiled bore; hole_coverage takes the feature's full parameter list as the requirement vocabulary."
