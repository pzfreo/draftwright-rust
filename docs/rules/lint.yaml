- id: LINT-angular-profile_angle_requirement
  statement: "Each issued outer-profile corner angle is stated on the drawing."
  detail: "Outcomes placed / satisfied_by_structured_note / suppressed / dropped (angular_dimension_dropped) / missing / unverifiable. Reported as angular_requirement_<state>: info when suppressed, else warning. A lost detected owner is missing even if stale annotation provenance survives."
