    issues: [487]
    tests: [tests/test_lint_reconciliation.py, tests/test_issue_1176_quality_fidelity.py]
  status: retired
  why: "Rules assessment 2026-10-11: there are no declared features."
  port_note: "Keep for declared (script) models."

- id: LINT-coverage-coverage_state
  statement: "The annotation passes record which callouts document hole patterns, which holes those cover, which scattered hole docs a table may replace, and which diameters/profiles the callout cap dropped."
  class: machinery
  source:
    module: "linting/coverage.py"
    issues: [138, 351, 647, 720]
  status: pending
  port_note: "Drop: side channel; derive from the plan/registry in Rust."

- id: LINT-coverage-examinable_declared_kinds
  statement: "The declared feature kinds that a truth check can examine against geometry are hole, boss, step and external spur gear."
  class: machinery
  source:
    module: "linting/coverage.py"
    issues: [1176]
  status: retired
  why: "The Rust Spec cannot declare replacement geometric features. Analysis is the geometry-derived feature inventory; there is no declared-vs-recognised feature truth-check denominator and no Python EXAMINABLE_DECLARED_KINDS roster to reproduce. This does not retire source/ink fidelity checks or feature coverage."
  rust_note: "Rules-text batch, 2026-10-16: inspected Python linting/coverage.py's EXAMINABLE_DECLARED_KINDS and declaration reconciliation against src/model.rs::Spec and src/lint/coverage.rs. No declaration API exists in this Rust architecture."
  port_note: "Adapt: needed only by the fidelity component."

# ---------------------------------------------------------------------------------------
# Envelope, boss, plates, channels
# ---------------------------------------------------------------------------------------

- id: LINT-envelope_coverage-overall_extents
  statement: "Each non-zero overall extent of the part (width X, depth Y, height Z) is stated on the drawing."
  detail: "Proved by one measurement spanning the full bbox interval on that axis, by a contiguous chain of step lengths that exactly partitions it (overlap does not count), or by a diameter of a coaxial rotational feature centred across it. Physical bbox is the denominator even when no envelope feature was detected. No lint code; feeds completeness."
  class: drafting
  source:
    module: "linting/envelope_coverage.py"
    issues: [1560]
    tests: [tests/test_issue_1560_envelope_axes.py]
  status: ported
  rust_test: "src/lint/envelope.rs::tests::any_measurement_spanning_the_box_states_the_extent"
  rust_note: "src/lint/envelope.rs: a ledger, placed or missing per non-zero axis of the Analysis's box, reported as missing_principal_dimension (Stage G1). Carriers, each only when its text prints the value: an envelope extent claim; any other claim whose physical span as lint reads it (redundancy::span: a face level, step position, plate thickness, slot length or width, boss height) is the axis's whole interval (stream K5); a centred turned-step, boss or overall diameter; a contiguous chain of turned-step lengths on one axis line (an overlap or gap breaks it). Compared with Python's ledger on the captured sheets (tests/fixtures/lint_ledgers.json, known_lint.json). Differences: draftwright's declared profile_group chains (the port has no declared models), measurements whose span lint does not read (a hole location end to end), and the suppressed, dropped and satisfied states (omissions and drops live outside the drawing, R1)."
  port_note: "Keep."

- id: LINT-code-missing_principal_dimension
  statement: "Each principal part extent appears as the value of some dimension label on the sheet."
  detail: "Tolerance max(0.5 mm, 0.1%); Y is skipped when X and Y are within 5% of each other; values are page extents divided by the drawing scale. Warning."
  class: drafting
  source:
    lint_code: "missing_principal_dimension"
    module: "linting/structural.py"
    tests: [tests/test_prismatic_classification.py]
  status: retired
  why: "Rules assessment 2026-10-11: superseded by the envelope ledger (LINT-envelope_coverage-overall_extents), which may reuse the code name."
  rust_note: "Not ported: draftwright's sheet lint never runs it. Its one lint_drawing call (linting/orchestration.py _lint_structure) passes no part_bbox, so _lint_principal_extents returns at once on every finished drawing, and no captured sheet reports it. The port's envelope coverage (lint::envelope) is the ledger of the same requirement. Whether to port it anyway is a question for the maintainer (docs/next-session.md)."
  port_note: "Keep only as a label-based backstop; prefer envelope_coverage."

- id: LINT-boss_coverage-diameter_height
  statement: "Each cylindrical boss states its diameter and its height."
  detail: "Parameters boss.diameter and boss_height.length, joined through conversion-time ownership; no lint code (completeness ledger only)."
  class: drafting
  source:
    module: "linting/boss_coverage.py"
    issues: [1788]
    tests: [tests/test_boss_ownership.py]
  status: ported
  rust_test: a_boss_states_its_height_by_a_dimension
  rust_note: "The height is judged as LINT-code-boss_height_missing (src/lint/bosses.rs). The diameter is not: in Python's lint it belongs to the coarse diameter inventory (feature_not_dimensioned), which is not ported. Since then the diameter is checked by the coarse diameter backstop (LINT-code-feature_not_dimensioned). Closed by the rules assessment of 2026-10-11."
  port_note: "Keep."

- id: LINT-plate_coverage-thickness
  statement: "Each body-local slab (plate) whose thickness is not already the overall envelope states its thickness."
  detail: "Parameter thickness.length."
