# Structural / layout checks (structural.py, ink_overlap.py)
# ---------------------------------------------------------------------------------------

- id: LINT-code-label_vs_measured
  statement: "A dimension's stated value equals the length of the path it is drawn on, divided by that annotation's drawing scale."
  detail: "Ignored when the label is correctly rounded (within half of the last displayed place, using the compiler's precision). Otherwise warning if the discrepancy exceeds 0.5%, error at 5% or more ('possible axis swap or wrong endpoint'). 'N× v' is a span of N pitches unless the producer tags a per-unit value; 'N× ⌀d' counts d-diameter features. Angular labels are excluded. Fidelity code."
  class: drafting
  source:
    lint_code: "label_vs_measured"
    module: "linting/structural.py"
    issues: [1600, 1153, 1209, 1216]
    tests: [tests/test_lint_structural.py, tests/test_issue_1006_measurement_comparison.py]
  status: ported
  rust_test: "tests/lint_fidelity.rs::a_linear_label_states_its_drawn_span_divided_by_the_view_scale"
  rust_note: "Stream K7, src/lint/fidelity.rs (run by structural::check, so review's structural list and tools/quality.py's review read it): the measured path is read from the ink alone, the span between a linear dimension's two extension lines (output::linear_ink), divided by its view's recorded scale (Sheet::frames); thresholds, severities and the correct-rounding exemption as draftwright, with the port's one-place sheet precision (dims::fmt) as the floor. Differences: every N× v the port draws spans one member (a pattern's first pitch, one rise, one of equal features), so N× v reads v where draftwright needs a producer tag; an INCH PMI label is compared in millimetres at its own printed places. Passes on the port's drawings of the 30 quality parts, the lint_structural corpus and the PMI fixtures (tests/lint_fidelity.rs::the_ports_own_pmi_drawing_says_what_it_draws catches a moved extension line on nist_ctc_01)."
  port_note: "Keep."

- id: LINT-code-nominal_rounded
  statement: "Where the sheet's display precision prints a nominal the model does not have, this is reported once per sheet with the worst case named."
  detail: "Info; shift floor 0.0005 mm. Not a fidelity defect: within a general tolerance it is ordinary drafting; advises raising places on dimensions that carry a fit."
  class: drafting
  source:
    lint_code: "nominal_rounded"
    module: "linting/structural.py"
    issues: [1600, 1610]
    tests: [tests/test_issue_1349_precision_display.py]
  status: ported
  rust_test: "tests/lint_fidelity.rs::a_correctly_rounded_label_is_noted_once_per_sheet"
  rust_note: "Stream K7, src/lint/fidelity.rs: once per sheet, info, from the same reading as label_vs_measured (shift floor 0.0005 mm, largest named). The port's spec has no display precision, so the message says the dimension needs more places, which the spec cannot yet ask for, in place of draftwright's .format(decimals=…) advice. Recorded on the corpus drawings in tests/fixtures/known_structural.json (7 parts, rust-correct)."
  port_note: "Keep."

- id: LINT-code-scale_not_stated
  statement: "A drawing states the scale it is drawn at."
  detail: "Error. ISO 7200 presents the scale outside the title block (draftwright draws it beside the projection symbol); checked on the rendered result. Fidelity code."
  class: drafting
  source:
    lint_code: "scale_not_stated"
    module: "linting/structural.py"
    tests: [tests/test_lint_structural.py]
