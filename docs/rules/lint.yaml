  port_note: "Keep."

- id: LINT-code-declared_feature_absent
  statement: "Every declared hole, boss or turned step corresponds to real geometry in the part, so no callout or centre mark points at solid material."
  detail: "Match: same axis, diameter within 0.2 mm, in-plane position within 0.5 mm, and correct polarity (hole = bore, boss/step = external). Declared double-D bores must match a through double-D profile. Warning; declared models only. Fidelity code."
  class: drafting
  source:
    lint_code: "declared_feature_absent"
