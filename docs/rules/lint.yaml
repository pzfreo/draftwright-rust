  rust_test: "tests/leader_rules.rs::a_diameter_tip_touches_the_rim_of_the_hole_it_names"
  rust_note: "Stream K4, src/lint/leaders.rs: a callout claiming bore.diameter in a view with a recorded transform, none of whose named holes has a readable boundary there (a hole record without axis, location or diameter; a double-D not seen end-on), is a warning with its reason. Recognition is always same-run in the port, and claims name their occurrence, so draftwright's ownership reasons do not arise."
  port_note: "Keep."

# ---------------------------------------------------------------------------------------
# Coarse coverage checks (coverage.py)
# ---------------------------------------------------------------------------------------

- id: LINT-code-feature_not_dimensioned
  statement: "Every recognised cylindrical diameter on the part (bore, counterbore/spotface step, boss) has a diameter callout on the sheet."
  detail: "Match tolerance 0.15 mm. Radius callouts do not count (an 'R5 TYP' note would mask an undimensioned bore); title blocks are skipped; structured callouts are not parsed as text (BCD suffixes are not feature coverage); diameters dropped by the callout cap are excluded; a boss diameter owned by a blend of the same face is excluded. Partial cylinders (slot ends, interrupted recesses) are not in the inventory."
  class: drafting
  source:
    lint_code: "feature_not_dimensioned"
    module: "linting/coverage.py"
    issues: [80, 92, 1351, 1450]
    tests: [tests/test_lint_coverage.py, tests/test_diameter_leaders.py, tests/test_issue_1505_diameter_coverage.py]
  status: pending
  rust_test: tests/lint_coverage.rs::pythons_backstop_is_reproduced_on_its_recorded_input
  rust_note: "Partly ported (src/lint/coverage.rs::feature_coverage, run by lint::check before boss heights, as draftwright orders it). Ported: the inventory (every readable hole's bore, counterbore and spotface diameter and every boss's, distinct; it equals draftwright's on all 11 compared parts), the 0.15 mm match, radius callouts not counting, a hole callout (a mark claiming a hole diameter) mentioning the diameters it prints before its bolt-circle clause and never read as free text, every other mark's ø/⌀ numbers. On draftwright's recorded input (tests/fixtures/lint_coverage/python.json.gz: 18 drawings, two with callouts taken off; ctc05's uncalled ø38.1, a stripped cgb245's ø10, a stripped m10127's ø8.4) the port's check gives exactly its findings. Nothing is excluded for a callout cap: the port drops no callout. Not ported: excluding a boss diameter that a blend of the same face owns (boss_blend_owner_pairs): it compares quiddity's defining faces, and the Analysis keeps only each feature's constituent faces (src/bridge.rs), which differ (grm04_drive_plate: boss [0, 3], blend [0]); structured-note and verified-cell authority (the port has neither); the assembly severity (always warning: the Analysis does not say whether the part is several bodies). Like draftwright, an uncalled hole is reported both here and by hole coverage (hole_requirement_missing); a misprinted callout leaves its diameter uncovered here too. Done in substance (rules assessment of 2026-10-11): the backstop works. Left pending for the boss-blend exclusion, which differs on grm04_drive_plate (boss faces [0, 3], blend [0]) and goes with face precedence (ISSUE-1450-a)."
  port_note: "Keep as a coarse backstop to the semantic ledgers."

- id: LINT-code-feature_count_mismatch
  statement: "For each hole diameter, the quantities stated by structured callouts account for every physical occurrence on the part."
  detail: "Each bore, counterbore and spotface occurrence counts one. Fires only when 0 < stated < required. A diameter covered by free text is exempt (text carries no count). Several representations of one owner are unioned, not summed. Disabled when the semantic hole ledger owns counts (Drawing.lint)."
  class: drafting
  source:
    lint_code: "feature_count_mismatch"
    module: "linting/coverage.py"
    issues: [92]
    tests: [tests/test_hole_pattern_callouts.py, tests/test_hole_table.py]
  status: ported
  rust_test: tests/lint_coverage.rs::pythons_backstop_is_reproduced_on_its_recorded_input
  rust_note: "src/lint/coverage.rs::count_mismatch (the check) and ::counts (on a drawing's marks: a hole callout provides its printed diameters at its leading n×, its owner the holes it claims). On draftwright's recorded input with the count check on (python.json.gz: ctc04's 30 ø14 / 12 ø6.6 and a stripped cgb245's 6 ø5) the findings are exactly draftwright's. As in draftwright's drawing lint (check_hole_counts=False), lint::check does not run it: counts are hole coverage's grouping.count. Severity is always warning: the Analysis does not say whether the part is an assembly."
  port_note: "Keep only if a standalone coarse check is wanted; the hole ledger supersedes it."

- id: LINT-code-feature_no_centermark
  statement: "Every hole, including each pattern member, has a centre mark in the view looking along its axis."
  detail: "Centre within 0.6 mm of the projected hole centre; Y-axis holes may use front or rear. One aggregated finding with the count of unmarked holes. Double-D bores included."
  class: drafting
  source:
    lint_code: "feature_no_centermark"
    module: "linting/coverage.py"
    issues: [218]
    tests: [tests/test_issue_1143_hole_completeness.py, tests/test_e2e_slice.py]
  status: ported
  rust_test: tests/centrelines.rs::a_plate_marks_every_pattern_member_and_lint_reads_the_drawn_marks
  rust_note: "The check is ported (src/lint/coverage.rs::location and ::judge: a centre mark within 0.6 mm of the hole's centre projected into its end-on view, front or rear for y; one finding counting the holes, naming them) and gives exactly draftwright's findings on its recorded input (python.json.gz: a cgb245 with its 16 centre marks taken off). Not run by lint::check: the port draws no centre marks (the Drawing records none), so on its own drawings it reports every hole (coverage::centre_marks; tests/fixtures/lint_coverage/known.json, rust-wrong, 9 parts, connector109 drawn only with LINT_OWN_ALL=1). Double-D bores are among the holes (coverage::sites, as Python's profiled_bores). Stage G6: lint reads the drawn centre marks and view transforms (coverage::drawn_centre_marks), never the plan."
  port_note: "Keep."

- id: LINT-code-feature_not_located
  statement: "Every hole that is not part of a pattern and not on the part's centre/turning axis has a locating dimension on each perpendicular axis where it is off-centre."
  detail: "An axis needs locating only if the hole is more than 1.0 mm from the part bbox centre on it. Pattern members are exempt (located by BCD/pitch). Evidence is a structured location fact for that feature and axis, a location note, or a dimension witness aligned within 0.6 mm; structured evidence, when present, is authoritative over coincident geometry."
  class: drafting
  source:
    lint_code: "feature_not_located"
    module: "linting/coverage.py"
    issues: [218, 93]
    tests: [tests/test_issue_1143_hole_completeness.py, tests/test_interior_label_placement.py]
  status: ported
  rust_test: tests/lint_coverage.rs::pythons_backstop_is_reproduced_on_its_recorded_input
  rust_note: "Partly ported (src/lint/coverage.rs::located, run by lint::check after boss heights). The judgement (::judge: pattern members exempt, an axis needs locating when the hole is more than 1.0 mm off the part box's centre across it, located by structured evidence or a witness within 0.6 mm on that page axis; one finding counting the holes, naming them, each axis not located a requirement) gives exactly draftwright's findings on its recorded input (python.json.gz: cgb245's 2, ctc03's 1, ctc04's 9, ctc05's 3, ftc09's 7, a stripped m10127's 1). On the port's drawings the evidence is structured only: an annotation claiming the hole's location.length.<axis>. Double-D bores are located as holes are (coverage::sites: at the record's location, along its axis, never patterned; src/lint/coverage.rs::tests::a_double_d_bore_is_located_as_a_hole_is). Not ported: the geometric witness fallback on the port's own drawings (the Drawing records neither its dimensions' witness points nor the views' projections), location notes (the port has none), and the assembly severity. On cgb245 the port locates the two holes draftwright leaves unlocated in y (known.json, rust-correct). Closed by the rules assessment of 2026-10-11: the geometric witness fallback and location notes have no input on the port's drawings, whose evidence is structured; nothing further is worth porting."
  port_note: "Keep."

- id: LINT-code-unrecognised_defining_geometry-principal_profile
  statement: "Every inner opening and the outer boundary on a principal face is a profile the drawing vocabulary can dimension (circle, axis-aligned rectangle, obround, double-D), or it is flagged as undefined geometry."
  detail: "Passages and prismatic pockets that exactly match the opening are reported by their own unsupported codes instead. An outer boundary with N equal, evenly spaced arcs on one circle is reported with that count (no gear standard inferred)."
  class: drafting
  source:
    lint_code: "unrecognised_defining_geometry"
    module: "linting/coverage.py"
    issues: [1058, 1245, 1246]
    tests: [tests/test_issue_1058_wheel_profile.py, tests/test_issue_1245_passage_disposition.py]
  status: ported
  rust_test: tests/lint_coverage.rs::pythons_principal_profile_scan_is_reproduced
  rust_note: "src/lint/profiles.rs. Lint never sees the part, so the scan is made when the part is analysed (profiles::evidence, the Analysis's principal_profiles, schema draftwright.analysis/6): each solid of a part of several (else the part), its box and each principal boundary face (a plane flat across one axis on the solid's box, Python's _principal_boundary_plane) with its inner loops' edges and its outer loop's arcs; lint judges it (profiles::verdicts, ::radial_count): an inner loop is supported as an open end of a closed square-ended section recess record, the mouth of a through double-D bore claimed once, or a circle, axis-aligned rectangle, true obround or rounded rectangle; an outer loop of six or more equal, evenly spaced arcs on one circle (not all its edges) is counted. One finding each, Python's messages; info on a part of several solids, as in Python. Against draftwright's own scan (tools/capture_lint_profiles.py: all 100 corpus parts and 27 of draftwright's test parts): every inner loop's verdicts agree (709 loops; the recess and double-D claims compared on the 65 parts whose recognition the port has or whose recognition has no bore or closed recess, by shape alone on the other 62), and so do the findings on those 65 parts (15 findings, among them ctc02's, ctc04's, m10127's and the oriented slots part's). Differences, in tests/fixtures/lint_coverage/known_profiles.json: on ctc01, ctc03 and ftc06 draftwright's box takes in the file's PMI presentation curves (build123d imports them with the solid), so it misses principal faces the port scans (their openings are supported; rust-correct); cgb241's box is OpenCascade's untrimmed B-spline box (rust-correct); ctc02's differs by an edge's 0.002 mm (equivalent). No corpus part has a toothed outline (the radial count is unit-tested only). On Rust quiddity's recognition (the CLI's default) section recesses are not read, so an opening a recess accounts for is reported unsupported (fail closed), and the Analysis's unrecognised lists section_recesses. Python claims double-D mouths in its recognition's order, the port in the Analysis's: equivalent, since a mouth matches only the loop at it."
  port_note: "Keep: independent B-rep scan for undimensionable profiles."

- id: LINT-code-unrecognised_defining_geometry-prismatic
  statement: "Bounded blind recesses and stepped or slanted profile transitions present in the geometry are represented by drawing features, or flagged as undefined geometry."
  detail: "Transitions are checked only when there are two or more shoulder stations (a lone transition may be owned by a plate-thickness scheme); channel walls and X/Y through-step bends count as owners."
  class: drafting
  source:
    lint_code: "unrecognised_defining_geometry"
    module: "linting/coverage.py"
    issues: [885]
    tests: [tests/test_issue_885_prismatic_coverage.py, tests/test_declared_recognition_gate.py]
  status: pending
  rust_note: "Not ported. Python compares two of its own stages: the pocket records and riser shoulders quiddity recognised (project_step_shoulders over the risers, two or more stations) against the features draftwright's conversion made of them (pocket IR, step_level shoulders, channel walls, X/Y through-step bends), and reports what the conversion dropped. The port has no conversion between the Analysis and the drawing: lint reads quiddity's features in the Analysis, and the height ladder's shoulders are projected from the same risers by the plan (dims::levels), which lint may not read, so the denominator Python checks against does not exist on the lint side. A pocket record lint cannot read in the part's frame is the pocket ledger's unverifiable (lint::pockets). Open question for the maintainer: should the port's lint instead check that each projected riser shoulder is stated on the drawing (a drawing check, not Python's stage check)?"
  port_note: "Keep."

- id: LINT-code-pad_footprint_not_defined
  statement: "Every rectangular raised pad has its footprint length and width, its height above the attachment face, and its in-plane location dimensioned."
  detail: "Non-Z pads require structured evidence for pad_width, pad_length, pad_height and both location axes. Legacy Z pads may use geometric witnesses; a pad edge coincident with the part edge counts as located. One aggregated warning with the count."
  class: drafting
  source:
    lint_code: "pad_footprint_not_defined"
    module: "linting/coverage.py"
    issues: [885]
    tests: [tests/test_issue_885_prismatic_coverage.py, tests/test_issue_1351_structured_note_coverage.py]
  status: ported
  rust_test: src/lint/prismatic.rs::tests::a_pad_is_defined_by_its_sizes_height_and_location
  rust_note: "Partly ported (src/lint/prismatic.rs::undefined_pads, run by lint::check after the location backstop, as Python orders it). Each Analysis pad is defined when each of lint::pads' requirements (pad_width, pad_length, pad_height, its locations from the part's box corner) is claimed by an annotation that prints it; a pad standing along z is also located along x or y by an edge on the part's box there (within 0.6 mm); a pad whose record cannot be read is undefined; one finding counting them, Python's message. Not ported: Python's dimension-witness evidence (any dimension spanning the pad's edges in the plan or side) and structured location notes (the Drawing records neither), and the assembly severity. Python judges the pads its conversion modelled, counting a dropped one undefined; here every Analysis pad is judged (there is no conversion), and a side pad's location coincident with the datum is not asked for, as the pad ledger and draftwright's compiler leave it out (Python's check still asks for it). On draftwright's test parts with sheets the findings agree, the port's own drawing of the pad part included since stream K5 dimensions pads (src/dims/pads.rs; tests/lint_coverage.rs::prismatic_and_profile_findings_on_draftwrights_test_parts_are_known). Closed by the rules assessment of 2026-10-11: witness evidence and notes have no input on the port's drawings; reading pads natively is the native recess work (ISSUE-885-a)."
  port_note: "Keep (or fold into the pad ledger)."

- id: LINT-code-pocket_not_located
  statement: "Every lone blind pocket has a complete in-plane location scheme."
  detail: "Per axis the pocket is located if it is symmetric about the part centre (within 1.0 mm), coincident with the datum edge, or a dimension spans from the datum (bbox minimum) to it. Edge-anchored pockets and pattern-located pockets are exempt; a pocket starting at the datum needs no long-axis centre dimension."
  class: drafting
  source:
    lint_code: "pocket_not_located"
    module: "linting/coverage.py"
    issues: [885]
    tests: [tests/test_issue_885_prismatic_coverage.py, tests/test_issue_1485_rounded_pockets.py]
  status: ported
  rust_test: src/lint/prismatic.rs::tests::a_pocket_is_located_by_symmetry_the_datum_or_a_stated_location
  rust_note: "Partly ported (src/lint/prismatic.rs::unlocated_pockets). Each lone blind pocket lint::pockets reads, not open at the part's edge, is located along each axis across it (x and y when cut along z, else its long and width axes) when its reference (its centre, its long-axis end when that end is within 0.6 mm of the box minimum) is within 1.0 mm of the box's centre, within 0.6 mm of the box minimum, or its location_pocket requirement on that axis is claimed and printed; one finding counting them, Python's message. Not ported: Python's dimension-witness evidence and structured notes (the Drawing records neither), recognised pocket patterns (the bridge drops them), and the assembly severity. Python excuses a pocket cut along z at the datum only by symmetry or a witness to its centre, though its planner places no centre location for a pocket starting on the datum; the port applies the catalogue detail's datum-start rule to it too (rust-correct; no captured part has one). On m10046 draftwright's sheet drops the pocket's two position dimensions and reports it unlocated; the port's drawing places them (tests/fixtures/lint_coverage/known.json, rust-correct). Python judges the pockets its conversion modelled; here every Analysis pocket is. Closed by the rules assessment of 2026-10-11: it is idle natively until pockets are read from Rust quiddity's document (ISSUE-885-a); nothing further here."
  port_note: "Keep (or fold into the pocket ledger)."

- id: LINT-code-axial_length_missing
  statement: "A turned profile with n axial steps has all n step lengths dimensioned so every shoulder is located."
  detail: "Counted from profile-view dimensions whose witnesses sit on both shoulders, verified schedule cells or structured notes matched by axial span. A rendered groove-width callout covers its band. Each body-local profile is judged independently. Suppressed when the chain drop was already reported and the overall axial extent is dimensioned."
  class: drafting
  source:
    lint_code: "axial_length_missing"
    module: "linting/coverage.py"
    issues: [223, 443, 1357]
    tests: [tests/test_axial_dimensions.py, tests/test_issue_443_grm03_axial_coverage.py]
  status: ported
  rust_test: "tests/completeness.rs::unstated_turned_band_length_and_diameter_are_lint_findings"
  rust_note: "src/lint/turned.rs: each band's step.length not placed is axial_length_missing (one per band, naming it, where Python counts per profile), judged per band and so per body-local profile; a baseline from an end locating both shoulders places it (#33), and a grouped label only when it states exactly its adjoining members (stream K5, tests/completeness_rules.rs::a_grouped_length_states_exactly_its_adjoining_members). Differences: Python's witness-on-both-shoulders and schedule/structured-note evidence have no input on the port's drawings (lint reads printed claims), and its suppression when a chain drop was reported is not reached (the port drops no chain)."
  port_note: "Keep."

- id: LINT-code-boss_height_missing
  statement: "Every boss with a modelled height has its height stated by a linear dimension; a diameter callout does not cover it."
  detail: "Covered by a Dimension annotation, verified cell or structured note for boss_height. A height consolidated onto an overall extent counts only once that extent is verifiably placed; a suppression that hands the fact to nobody is reported."
  class: drafting
  source:
    lint_code: "boss_height_missing"
    module: "linting/coverage.py"
    issues: [632, 1154, 964]
    tests: [tests/test_issue_1154_one_owner_per_measurement.py, tests/test_issue_1511_turned_boss_heights.py]
  status: ported
  rust_test: "tests/h5_chains.rs::consolidated_flush_boss_height_is_not_reported_missing"
  rust_note: "src/lint/bosses.rs: each boss whose record gives a height must have boss_height.length claimed by an annotation that prints it (src/lint/bosses.rs::tests::a_boss_states_its_height_by_a_dimension); a groove's floor and a turned step's band are not judged. A boss flush with the part's box along its axis is credited from the stated overall extent, read from the boss's physical span, not the plan's omission (Stage H second pass; the remainder this entry was left pending for). Differences: one finding per boss, naming it, where Python counts them; bosses absorbed into blends by recognition ownership and the assembly severity are not reached (the Analysis says neither). Rules re-assessment in stream K5 (no new code)."
  port_note: "Keep."

- id: LINT-code-turned_profile_not_spanned
  statement: "The declared steps of a turned profile describe the whole axial length of the body; any undescribed stretch is reported."
  detail: "Warning. Only run for a caller-declared model (scoping choice, not immunity of the detection path). Hints that external cylinders on a prismatic part should be bosses."
  class: drafting
  source:
    lint_code: "turned_profile_not_spanned"
