- id: LINT-code-hole_requirement_state
  statement: "Uncovered hole requirements are reported per requirement as hole_requirement_missing, hole_requirement_suppressed or hole_requirement_unverifiable, naming quantity, diameter, THRU or blind depth and axis."
  detail: "Severity info for assemblies, else warning. Message format: 'N× øD THRU holes, axis A at (x,y,z) requirement <id> <reason>'."
  class: drafting
  source:
