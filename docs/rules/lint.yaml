- id: LINT-through_step_coverage-two_legs
  statement: "A rectangular through step states both orthogonal legs of its open section."
  detail: "Parameters through_step_leg.length.{x|y|z}. A leg may instead be proved by an alternative grammar: a plate thickness, a step height, a step position, or an envelope extent whose interval matches the leg within 0.5 mm. Two records resolving to the same alternative owners are ambiguous and fail closed."
  class: drafting
  source:
    lint_code: "through_step_requirement_missing"
    module: "linting/through_step_coverage.py"
    issues: [1382]
    tests: [tests/test_framed_step_family_evidence.py]
  status: ported
  rust_test: a_through_step_along_y_may_be_stated_by_the_ladder_or_a_plate
  rust_note: "src/lint/steps.rs: each leg of the section is a requirement through_step_leg.length.<axis>, named by the part's axis it lies along (a_through_step_states_both_legs_named_by_the_parts_axes), stated by a dimension that claims it and prints its length; a section that is not two legs, or a leg along no axis of the part, is unverifiable. For a step running along x or y, a leg may instead be stated by the legacy grammar (alternatives, _legacy_owner_plans): a step height or step position claimed on step_level, or a plate's thickness, alone when its interval is the leg's, or with the overall extent (envelope width/depth/height) when the leg is the rest of it, every interval within 0.5 mm; each term must be claimed and its value printed. Two steps whose legs have the same alternatives get no credit from them, and a leg their own dimension does not state is unverifiable. Deliberate departures, forced by ADR R4: Python takes the alternatives only for a step its conversion did not lower and judges a lowered one by its own legs, a decision in draftwright's drafting model that lint cannot see, so a leg here is stated by either; the term values are the leg's (Python requires the owner's, whose interval is within 0.5 mm of it); and lint's marks carry no drawn span, so the claim and its printed value stand in for Python's span check. On Python's sheets and the port's own drawings of stepped_block (a step along y left to the ladder and extents) and rectangular_through_step, and m10127's captured sheet, the two lints agree (oriented_slots_and_through_steps_match_pythons_lint_or_are_known, coverage_on_pythons_sheets_matches_pythons_lint_or_is_known); no fixture has a step whose leg a plate states, which the unit test covers."
  port_note: "Keep."

