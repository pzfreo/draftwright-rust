# Source: pzfreo/draftwright origin/main @ 586628b96db6779454d499c7d92d37f1aa8f1df9 (docs/adr/0001-0005 + docs/adr/archive/*.md)
# Rules catalogue: ADR invariants and decision-level rules.
#   id ADR<n>-<k>   live ADR n, numbered invariant k
#   id ADR<n>-D<k>  live ADR n, decision-level rule stated in the Decision/Boundaries text (not numbered there)
#   id ADR<n>-U<k>  live ADR n, rule listed under "Unguarded"
#   id ARCH<nnnn>-<k> archived ADR nnnn, only rules not already captured by the live ADRs
# class: drafting | trust | machinery. status is always pending.

# ---------------------------------------------------------------------------
# ADR 1 - The compiler pipeline
# ---------------------------------------------------------------------------

- id: ADR1-D1
  statement: "There is one engine: every user-facing surface is a front door onto the same build path."
  detail: "build_drawing, make_drawing, Sheet, the CLI and script generation all reach build_drawing -> _auto_annotate."
  class: machinery
  source:
    adr: "ADR 1 Decision"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R1 decision: the CLI, service and MCP adapters are thin over the five operations; no surface has its own pipeline."
  port_note: "Translate: CLI, library and any MCP/HTTP surface call the same analyse->spec->plan->render functions; no surface-specific pipeline."

- id: ADR1-1
  statement: "The import graph is a ranked DAG: no runtime import points up."
  detail: "Every module is in _LAYERS; annotations/ imports only down or sideways; TYPE_CHECKING-only upward references are enumerated."
  class: machinery
  source:
    adr: "ADR 1 invariant 1"
    issues: []
    tests: ["test_import_boundaries.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Module dependencies point downward (output and text know nothing of model). Differs from port note: a crate split for its own sake is not needed while the code is one crate; the one boundary that must be hard is lint's (ADR1-9)."
  port_note: "Translate: enforce layering with the Cargo crate graph (geometry/analysis below spec below plan below render; lint not depending on plan)."

- id: ADR1-2
  statement: "Drawing is not a state bus: render passes take an explicit context and never read Drawing privates."
  detail: "PlacementContext; empty fail-closed private-read allowlist; BuildState has one construction and one fill site. Annotation identity belongs to the registry; coverage state belongs to lint."
  class: machinery
  source:
    adr: "ADR 1 invariant 2"
    issues: []
    tests: ["test_drawing_encapsulation.py (test_no_engine_module_touches_drawing_privates, test_build_state_has_a_single_construction_and_fill_site, test_no_build_context_probing)"]
  status: retired
  why: "R4 (accepted 2026-10-07): Operations are pure functions over documents; there is no mutable drawing object to protect."
  port_note: "Retire: a stateless API over Analysis/Spec/Plan documents has no mutable Drawing object to protect."

- id: ADR1-3
  statement: "One feature inventory per build, detected once; page/scale sizing reads the same model the renderers do."
  detail: "_analyse builds the PartModel up front; _assemble attaches it before the auto_dims gate; the orchestrator reads it rather than rebuilding."
  class: machinery
  source:
    adr: "ADR 1 invariant 3"
    issues: []
    tests: ["test_detect_once.py", "test_part_model.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The Analysis is the only feature inventory; plan (including page and scale) reads Analysis and Spec only."
  port_note: "Translate: the Analysis document is the single feature inventory; planning (including scale/page sizing) reads only Analysis+Spec, never a second detection."

- id: ADR1-4
  statement: "Two front doors, one waist: detection and declaration emit the same feature types into the same model."
  detail: "Downstream branches on no producer flag except the one that gates parity behaviours (model_declared)."
  class: machinery
  source:
    adr: "ADR 1 invariant 4"
    issues: []
    tests: ["test_part_model.py", "test_declare.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Analysis features and Spec-declared or overridden features resolve to one feature set before planning; nothing downstream branches on producer."
  port_note: "Translate: detected features (Analysis) and Spec-declared/overridden features resolve to one feature set before planning; planner and renderers never branch on producer."

- id: ADR1-5
  statement: "Recognition records cross into the drafting model at exactly one adapter, which is fail-closed over the provider's record universe."
  detail: "Universe derived mechanically from return annotations; each record type has exactly one home."
  class: machinery
  source:
    adr: "ADR 1 invariant 5"
    issues: []
    tests: ["test_detect_registry.py", "test_external_recognition_boundary.py"]
  status: translated
  port_note: "Translate: one analyse adapter from quiddity records to Analysis features, using exhaustive Rust match so a new record type fails to compile until homed."
  rust_rule: "src/bridge.rs is the one adapter from quiddity's recognition JSON to the Analysis; its home() match gives every record type it knows one home (feature, evidence or refusal) and the read fails on any other type. The records arrive as JSON, so an unknown type fails at read time, not at compile time."
  rust_test: refusals_and_evidence_are_not_features

- id: ADR1-6
  statement: "Orientation is data: a feature group's view is derived from its frame by one rule, so X and Z are symmetric."
  detail: "Feature.frame carries the axis; _END_ON for a diameter callout (z->plan, x->side, y->front), _PROFILE for a turned step's length/OD (front is the x-z plane). No kind == 'step' branch chooses a view (ADR 0008 Amendment 1, ADR 0015)."
  class: drafting
  source:
    adr: "ADR 1 invariant 6; archive 0008 Amendment 1, 0015"
    issues: [731]
    tests: ["test_turned_steps.py", "test_principal_profile_classifier.py"]
  status: pending
  rust_test: tests/dimension_rules.rs::a_holes_view_follows_from_its_axis
  rust_note: "Ported for holes (and their locations, pitches and callouts), the overall extents, and fillet and chamfer callouts (end-on to the edge, or in the profile when turned: src/dims/edges.rs); turned steps are not planned yet."
  port_note: "Keep: view routing is a pure function of feature axis and measurement kind in the planner; record it as the plan entry's basis."

- id: ADR1-7
  statement: "Dimension-bearing passes consume planner output; exceptions are enumerated by contract."
  detail: "plan_dimensions runs once per pass sequence; every render_* of generated dimensions is on the plan contract; exceptions are correlated ladders, PMI, GD&T and the declared gear table; the advisory 'groups' tier is empty."
  class: machinery
  source:
    adr: "ADR 1 invariant 7"
    issues: []
    tests: ["test_compiled_plan_boundary.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R1 invariant 2. The exceptions (PMI, GD&T, the gear table) become Plan items with a source-authored basis, so there is no second channel to enumerate."
  port_note: "Translate: renderers consume Plan entries only; there is no second 'groups' channel to enumerate."

- id: ADR1-8
  statement: "One owner per physical measurement: two features measuring between the same two faces reconcile by support-plane coincidence, and the overall extent takes the fact."
  detail: "Nothing is deduplicated by value (a 100 x 95 part was once read as square, #997); a toleranced measurement is never handed over (asymmetric: a tolerance on the receiving extent does not block); only an envelope extent may take ownership; a handover requires the receiving extent to actually be drawn; the yielding dimension records Omission.conveyed_by (ADR 0015 amendment #1154)."
  class: drafting
  source:
    adr: "ADR 1 invariant 8; archive 0015 amendment 'cross-feature reconciliation by support-plane identity'"
    issues: [1154, 997]
    tests: ["test_issue_1154_one_owner_per_measurement.py", "test_issue_1153_contradictory_dimensions.py"]
  status: pending
  port_note: "Keep: planner reconciliation rule; the withheld dimension appears in the Plan as an omission with basis 'conveyed_by <id>'."

- id: ADR1-9
  statement: "Lint does not import the drafting model, so a completeness check cannot be derived from the plan."
  detail: "linting/ imports no draftwright.model: a completeness check that read the plan or the IR could not flag what the planner omitted."
  class: trust
  source:
    adr: "ADR 1 invariant 9 and Decision"
    issues: []
    tests: ["test_import_boundaries.py (test_linting_does_not_import_model)"]
  status: ported
  rust_test: lint_never_reads_the_plan_or_the_spec
  rust_note: "src/lint is a module; its guard (src/lint/guard.rs) refuses any Plan or Spec name and any crate path but the Analysis, the bridge and the rendered drawing; the_guard_catches_what_it_should proves the guard bites."
  port_note: "Keep: the lint/completeness crate depends on Analysis (recognition) and rendered output only, never on Plan/Spec as its denominator; enforce via crate deps."

- id: ADR1-10
  statement: "Expired compatibility surfaces stay deleted, and every remaining compat surface carries a tracking issue and a removal date."
  detail: "Seven Drawing aliases, generate_script, --style imperative and sheet_dsl are asserted absent."
  class: machinery
  source:
    adr: "ADR 1 invariant 10"
    issues: [720]
    tests: ["test_drawing_encapsulation.py (test_the_expired_compat_aliases_stay_deleted, test_the_deleted_modules_and_stubs_stay_deleted)", "test_deprecation_dates.py"]
  status: retired
  why: "R4 (accepted 2026-10-07): None of the Python surfaces exist. Differs from port note: the dated-shim principle is replaced by schema versions, and an unknown schema is refused (ADR3-4)."
  port_note: "Retire: the Python compat surfaces do not exist in the port; keep only the principle that any compat shim has a dated exit."

- id: ADR1-11
  statement: "Reporting sits beside lint and consumes the shared requirement ledger explicitly; it never reaches through the drawing object."
  detail: "reporting.py at rank 2 beside linting; both consume linting/requirements.py."
  class: machinery
  source:
    adr: "ADR 1 invariant 11; archive 0005 amendment 2026-09-03"
    issues: [1438]
    tests: ["test_import_boundaries.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Report and completeness read one requirement ledger computed from Analysis and the rendered sheet."
  port_note: "Translate: report generation and completeness read one requirement ledger computed from Analysis + rendered outcomes."

- id: ADR1-12
  statement: "Private test reads are a shrinking allowlist."
  class: machinery
  source:
    adr: "ADR 1 invariant 12"
    issues: []
    tests: ["test_private_test_attr_reads.py", "test_private_test_imports.py"]
  status: retired
  why: "R4 (accepted 2026-10-07): Rust visibility makes it a compile-time property."
  port_note: "Retire: Rust visibility rules make this a compile-time property."

# ---------------------------------------------------------------------------
# ADR 2 - Sheet layout and view planning
# ---------------------------------------------------------------------------

- id: ADR2-D1
  statement: "Which views exist is the engine's decision, driven by requirements: a view earns its place by carrying measurements no other selected view can."
  class: drafting
  source:
    adr: "ADR 2 Decision"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: every Plan view carries the requirement ids that justify it as its basis."

- id: ADR2-D2
  statement: "Page, preferred standard scale, view set and arrangement are one constrained choice; a candidate is feasible only if the real placement solve preserves every supported requirement with every block in bounds."
  detail: "Evaluated against complete view blocks measured with fixed paper-space typography; paper economy never outranks requirement survival, legibility or projection convention."
  class: drafting
  source:
    adr: "ADR 2 Decision"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: page/scale/view selection in the planner is judged on the finished placement, not geometry bounds."

- id: ADR2-D3
  statement: "Infeasibility is a first-class result, never a silent relaxation of an authored constraint."
  class: trust
  source:
    adr: "ADR 2 Decision"
    issues: []
    tests: []
  status: ported
  port_note: "Keep: an infeasible Spec constraint yields a structured Plan problem naming the constraint, never a quietly altered plan."
  rust_test: tests/trust_rules.rs::an_authored_constraint_is_kept_and_its_infeasibility_reported
  rust_note: "The spec's constraints are its sheet size and scale, its view omissions and its dimension source and omissions. A sheet and scale that cannot hold the views are kept, with page_fit_uncertain; a scale no sheet holds is kept on A0, with views_do_not_fit; an omitted view stays omitted and what only it could carry is reported (view_plan_incomplete; also tests/dimension_rules.rs::nothing_approved_vanishes_when_its_view_is_omitted); a value outside the vocabulary is refused with the choices (tests/model.rs::invalid_requests_say_what_would_do)."

- id: ADR2-D4
  statement: "Compose-then-pack: each selected view is composed with its annotation footprint before the page is packed."
  detail: "Footprints are page-mm boxes so the scale/page search is rectangle arithmetic; OCC geometry is built once at the resolved position; a bounded measured repack corrects the seed estimate. The block footprint includes dimensions, callouts, balloons and furniture such as the hole table (archive 0004)."
  class: drafting
  source:
    adr: "ADR 2 Decision; archive 0004"
    issues: [121]
    tests: []
  status: pending
  rust_test: bands_match_draftwright_or_are_known
  rust_note: "The block and packing arithmetic is ported and checked by layout_calls_match_draftwright; model::plan reserves the bands the bridged features need (src/demand.rs, checked against draftwright's by bands_match_draftwright_or_are_known, differences in tests/fixtures/known_bands.json), but not the hole-callout band, authored/scheme bands or angular footprints, and has no measured repack yet."
  port_note: "Keep: the planner sizes each view block including its annotations before choosing page/scale."

- id: ADR2-D5
  statement: "Within a view, annotations are never placed as they are rendered: every pass collects candidates, one deterministic solve per strip selects, orders and spaces them, then they are emitted."
  detail: "Over capacity is a ranked selection, not an arrival-order drop."
  class: drafting
  source:
    adr: "ADR 2 Decision; archive 0009, 0014"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: plan-stage placement collects all strip occupants then solves; drop order is by priority/key, recorded per entry."

- id: ADR2-D6
  statement: "Policy B: when avoiding an occupant would cost more than a bounded relocation, the annotation stays and the crossing is logged; never an unbounded search, never a real annotation dropped for tidiness."
  detail: "Archive 0009 Amendment 2 bound: relocate only when it costs no more than one min_gap of extra displacement from the natural position. Ratified 2026-07-02: 'I would rather have a crossing leader line than drop the callout'."
  class: drafting
  source:
    adr: "ADR 2 Decision; archive 0009 Amendment 2, 0014"
    issues: [368]
    tests: ["test_layout_cleanliness.py"]
  status: pending
  port_note: "Keep: placement rule; a retained crossing is a Plan problem (info) attached to the annotation id."

- id: ADR2-D7
  statement: "Users edit whole view blocks (presence, relations, a pin on a projection origin), never feature-annotation coordinates."
  class: spec
  source:
    adr: "ADR 2 Decision"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R1 invariant 1: Spec views carry presence, relations and an optional origin pin; the Spec has no coordinates."
  port_note: "Translate: Spec view entries carry presence, relational constraints and an optional origin pin; Spec has no annotation coordinates."

- id: ADR2-1
  statement: "Footprints are boxes, the scale/page search is box math, and the corrective repack is bounded."
  detail: "No OCC bbox is measured inside the (scale, page) search; _REPACK_MAX_ITER bounds the corrective loop. The rule constrains the fitness search, not post-build verification (archive 0004 amendment 2026-07-18)."
  class: machinery
  source:
    adr: "ADR 2 invariant 1"
    issues: []
    tests: ["test_layout.py", "test_repack_geometry_seam.py", "test_issue_1216_callout_reservation_measures_ink.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The estimate-then-verify structure and its iteration bound stay, for termination and determinism; the OpenCascade cost that motivated it is gone (R2)."
  port_note: "Translate: keep the estimate-then-bounded-verify structure in the Rust planner; the OCC-cost motivation largely disappears but the bound on iterations stays."

- id: ADR2-2
  statement: "An explicit scale may cramp geometry but never silently lose a requirement."
  detail: "Default policy retries smaller preferred ISO 5455 scales and selects the largest complete candidate at or below the request; strict refuses; permissive warns; the decision is recorded with stable blocker identities (archive 0004 amendment #1146)."
  class: drafting
  source:
    adr: "ADR 2 invariant 2; archive 0004 amendment 2026-08-14"
    issues: [1146]
    tests: ["test_issue_1146_scale_completeness.py"]
  status: pending
  port_note: "Keep: Spec scale policy {default, strict, permissive}; the Plan records requested/effective scale, attempts and blocker ids."

- id: ADR2-3
  statement: "Scale before sheet: a bounded larger-scale trial on the selected page runs before the optional isometric is removed and before a larger sheet is tried."
  detail: "Every attempt is recorded; hard two-candidate work budget; an explicitly requested page pins the sheet, not the scale (archive 0004 amendments #1155, #1338)."
  class: drafting
  source:
    adr: "ADR 2 invariant 3; archive 0004 amendments 2026-08-23, 2026-08-25"
    issues: [1338, 1155]
    tests: ["test_issue_1338_scale_before_page_escalation.py", "test_issue_1299_page_escalation.py", "test_issue_1155_grm04_sheet_use.py"]
  status: pending
  port_note: "Keep: escalation order in the planner; each attempt recorded in the Plan's scale decision."

- id: ADR2-4
  statement: "Every non-exempt strip occupant is a solve candidate; exemptions are a fail-closed allowlist recorded in the ADR first."
  detail: "Exemptions: the diagonal pitch-dim fallback (permanent), post-drain GD&T/plate fallthroughs, and manual post-build single-annotation verbs (archive 0014)."
  class: machinery
  source:
    adr: "ADR 2 invariant 4; archive 0014"
    issues: []
    tests: ["test_carve_free_position_callers.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): One strip solver in the planner; any other placement path is a listed exception in this record."
  port_note: "Translate: one strip solver in the planner; any non-solver placement path is an explicit, listed exception."

- id: ADR2-5
  statement: "The strip solve is exact and dependency-free: minimum total leader length, crossing-free for distinct anchors, ranked drop over capacity."
  detail: "Weighted-median PAVA with per-pair gaps, global box clamp and a fixed lower-median tie convention; label order along the strip = feature order; coincident sites tie-break by key. Cassowary and scipy linprog were retired because non-unique optima broke cross-platform determinism (archive 0009 Amendments 3-4)."
  class: drafting
  source:
    adr: "ADR 2 invariant 5; archive 0009 Amendments 3-4, 0014"
    issues: [318]
    tests: ["test_strip_layout.py", "test_layout_property.py", "test_layout_hypothesis.py"]
  status: pending
  port_note: "Keep: port the PAVA solver with the identical tie rule; property-test crossing-freedom and determinism."

- id: ADR2-6
  statement: "One stage order, two entry paths: a single canonical pass sequence is run by both the automatic build and the edit-drain."
  detail: "_PASS_SEQUENCE run through run_stages by _auto_annotate and finalize(). That it is the only stage tuple is enforced by structure, not mutation (ADR 1 Unguarded)."
  class: machinery
  source:
    adr: "ADR 2 invariant 6; ADR 1 Unguarded"
    issues: [699]
    tests: ["test_issue_563_placement_intent.py"]
  status: retired
  why: "R4 (accepted 2026-10-07): There is no drain: a Spec edit is re-planned whole by the one plan."
  port_note: "Retire: there is no deferred-intent drain; Spec edits are re-planned from scratch by the one plan() function."

- id: ADR2-7
  statement: "Feature leaders are assigned jointly, late and observably; unknown provenance is never silently optional, and a fired work budget is a named capability loss."
  detail: "Lexicographic objective: required jobs, unknown jobs, optional jobs, priority, fixed-obstacle penalty, length, order. Budgets count measured work (prefer counting real work to predicting it; any pre-check must be exact). The class-first greedy result is the floor under every cap (archive 0014 Amendments 1-5)."
  class: drafting
  source:
    adr: "ADR 2 invariant 7; archive 0014 Amendments 1-5"
    issues: [740, 1166, 1188, 1308]
    tests: ["test_issue_1166_cross_pass_feature_leaders.py", "test_issue_740_leader_assignment.py", "test_issue_1188_per_view_assignment.py", "test_issue_1308_machined_leader_analytics.py"]
  status: pending
  port_note: "Keep: joint leader assignment in the planner; a hit budget emits a structured Plan problem naming the lost capability."

- id: ADR2-8
  statement: "Material re-entry is one predicate shared by the leader router and the critique, and it is a cost, never a gate."
  detail: "A leader's first exit from the body is legitimate; a second traversal is a cut. Priced at one unit per visible stroke width of buried shaft, alongside the Policy-B penalty. The material field is built once per build under explicit tessellation control (copy, clean, mesh) so it is not a function of build history (archive 0014 Amendment 3)."
  class: drafting
  source:
    adr: "ADR 2 invariant 8; archive 0014 Amendment 3"
    issues: [798, 1187]
    tests: ["test_issue_798_material_field.py", "test_issue_798_silhouette_lint.py", "test_issue_798_floor_cardinality.py", "test_issue_1187_unroutable_leaders.py"]
  status: pending
  port_note: "Keep: one re-entry function used by planner and lint; tessellation must be deterministic in the Rust kernel."

- id: ADR2-9
  statement: "Policy B crossings remain visible: a retained, measured fixed-ink crossing is recorded as a finding with callout and obstruction provenance."
  detail: "feature_leader_crossing; an exhausted fixed-ink probe budget yields feature_leader_fixed_ink_unverified; representative finished sheets are checked for layout defect codes."
  class: trust
  source:
    adr: "ADR 2 invariant 9"
    issues: []
    tests: ["test_issue_1166_cross_pass_feature_leaders.py (test_immediate_producer_floor_records_a_retained_fixed_crossing_issue_2112, test_ownerless_section_centerline_at_the_tip_is_not_a_global_axis_exemption)", "test_layout_cleanliness.py (test_finished_sheet_has_no_layout_collisions)"]
  status: pending
  port_note: "Keep: retained crossings and unverified ink become Plan problems referencing the annotation id and the obstruction id."
  rust_note: "Not ported: placement checks label boxes against labels, views, the title block and the sheet, but not lines crossing other views' outlines or other dimensions' lines (docs/model.md, 'Not checked yet'), so a crossing is neither avoided nor recorded, and there is no fixed-ink probe. Owed with the placement solver (src/dims/placement.rs)."

- id: ADR2-10
  statement: "Same-batch dimension ink is visible before commit and is resolved by a bounded strictly-improving local solve, not a second placement engine."
  detail: "Bounded along-dimension-line label alternatives; pinned candidates immutable. GD&T frames check full glyph+leader against settled and same-batch ink; an infeasible authored frame relocates or reports a named drop rather than overprinting; pitch, step-height and imported PMI dimensions check finished ink; a bounded failed search reports the missing annotation rather than claiming illegible ink as placed."
  class: drafting
  source:
    adr: "ADR 2 invariant 10; archive 0014 Amendment 6"
    issues: [1334]
    tests: ["test_issue_1334_prevent_ink.py", "test_gdt_ink_shared.py", "test_remaining_ink_overlaps.py"]
  status: pending
  port_note: "Keep: post-assignment ink check inside the planner; unresolved overlap is a Plan problem (annotation_ink_overlap)."

- id: ADR2-11
  statement: "One view vocabulary; the authored view request and the resolved view plan are distinct immutable states."
  detail: "ViewSpec values; ViewConstraints is the authored request; ResolvedViewPlan is immutable, attached once, and read-only."
  class: spec
  source:
    adr: "ADR 2 invariant 11"
    issues: []
    tests: ["test_view_plan.py", "test_issue_1260_view_constraints.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Spec views (request) and Plan views (result) share one vocabulary in separate documents. True by construction in src/model.rs."
  port_note: "Translate: Spec views (request) and Plan views (result) are separate documents sharing one view vocabulary."

- id: ADR2-12
  statement: "Authored constraints are never relaxed, and an approved dimension no authored view can carry fails before projection, naming the view to add."
  detail: "Authored views with auto_dimensions() raises at the verb; ViewPlanIncomplete names the unshowable dimension by DimensionId and the view that would show it; view_decision is always present."
  class: trust
  source:
    adr: "ADR 2 invariant 12; archive 0018 Amendment 1"
    issues: [1260]
    tests: ["test_issue_1260_view_constraints.py", "test_adr0018_view_routing.py"]
  status: ported
  rust_test: tests/dimension_rules.rs::nothing_approved_vanishes_when_its_view_is_omitted
  port_note: "Keep: Plan problem 'view_plan_incomplete' listing dimension ids and suggested view; produced before any rendering."

- id: ADR2-13
  statement: "View removal is requirement-aware: the optional isometric yields only to preserve manufacturing completeness, and no principal view is removed automatically."
  detail: "Never for space, crowding or preference; on the settled page and arrangement; symptom recorded in scale_decision; triggers are builder._ISO_YIELD_TRIGGERS. Silhouette similarity is not proof of redundancy; absent correspondence fails conservatively (archive 0018 §3, Amendment 3)."
  class: drafting
  source:
    adr: "ADR 2 invariant 13; archive 0018 §3, Amendment 3"
    issues: []
    tests: ["test_adr0018_view_selection.py", "test_issue_1262_automatic_turned_views.py", "test_issue_443_grm03_axial_coverage.py", "test_issue_1190_section_decision.py"]
  status: pending
  rust_test: a_turned_part_leaves_out_the_view_that_repeats_its_profile
  rust_note: "The turned-part reduction (ISSUE-1262-a) states its reason in the kept views' basis; the isometric's requirement-aware yield is not ported."
  port_note: "Keep: planner rule; any view removal records the triggering requirement in the Plan basis."

- id: ADR2-14
  statement: "Detail and isometric view scale factors are exact, and unequal principal-view scales are refused."
  detail: "Independently enlarged detail views carry their scale; an independently resized orientation/isometric view is labelled NTS (archive 0018 §7)."
  class: drafting
  source:
    adr: "ADR 2 invariant 14; archive 0018 §7"
    issues: []
    tests: ["test_issue_1204_multiscale_view_issues.py"]
  status: pending
  port_note: "Keep: Plan views carry exact scale; validation rejects unequal principal scales."

- id: ADR2-15
  statement: "The placement solve is recordable: every corridor solve and pass event can be dumped, and a strip-full drop names its occupants."
  detail: "build_drawing(trace=...); the trace is recording-only and an unwritable trace path logs a warning, never aborts a build (archive 0014)."
  class: trust
  source:
    adr: "ADR 2 invariant 15; archive 0014 Consequences"
    issues: [736]
    tests: ["test_solve_trace.py"]
  status: pending
  port_note: "Keep: optional placement trace output alongside the Plan; drop problems name the occupants by annotation id."
  rust_note: "Not ported: placement stacks lanes with no solve to trace, and drops nothing for want of room (an item is unplaced only when no shown view can carry it, reported as view_plan_incomplete). The trace belongs with the strip solver (ADR2-5), not yet ported."

- id: ADR2-16
  statement: "Settled page validity precedes completeness: page/title-block bounds and annotation-ink overlaps veto an automatic page/scale proposal before required-outcome completeness is compared."
  detail: "Crossings and other structural vetoes are later tiers; a dirty result after the bounded ladder records status='invalid' plus stable violation evidence."
  class: drafting
  source:
    adr: "ADR 2 invariant 16"
    issues: []
    tests: ["test_issue_1299_page_escalation.py", "test_issue_1146_scale_completeness.py"]
  status: pending
  port_note: "Keep: candidate comparison order in the planner; an exhausted ladder yields Plan status invalid with violation ids."

- id: ADR2-17
  statement: "Interior feature labels are typed solver candidates with region provenance, never coordinates; a corridor dimension may use an interior fallback only after its exterior corridors are exhausted."
  detail: "Complete label stays inside its owning view and clears projected and committed ink without Policy B; the whole rendered dimension moves as one candidate; only its label must occupy proven projected whitespace; an infeasible retry reports the original drop unchanged."
  class: drafting
  source:
    adr: "ADR 2 invariant 17"
    issues: []
    tests: ["test_feature_leader_candidate_regions.py", "test_interior_label_placement.py"]
  status: pending
  port_note: "Keep: planner rule for interior placement; Plan entry records interior region as basis."

- id: ADR2-18
  statement: "An alternative annotation layout earns selection only on a finished drawing, by strict measured improvement with page, scale, meaning and coverage held fixed."
  detail: "Opt-in annotation_layout='compare'; rejects new requirement blockers or interior dimensions; an ineligible or failed candidate cannot replace the established drawing."
  class: machinery
  source:
    adr: "ADR 2 invariant 18"
    issues: []
    tests: ["test_annotation_layout_product.py", "test_annotation_scheme_compare_script.py"]
  status: retired
  why: "R4 (accepted 2026-10-07): The port has one layout algorithm. If a second is ever added, this returns as a Spec option whose Plan records the comparison."
  port_note: "Retire unless the port keeps multiple layout algorithms; if kept, translate as a Spec option whose Plan records the comparison."

- id: ADR2-19
  statement: "The normal annotation layout is one demand-guided build; it never silently rerenders an alternative after a failed completeness check."
  detail: "estimated-strips remains an explicit compatibility choice; API, Sheet, generated scripts and CLI share the default; generated scripts spell out their mode; unmet-requirement reporting applies to either algorithm."
  class: machinery
  source:
    adr: "ADR 2 invariant 19"
    issues: []
    tests: ["test_annotation_layout_product.py", "test_layout_safety.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R1 invariant 7: plan is one deterministic computation with no hidden retry under a different algorithm."
  port_note: "Translate: one layout algorithm by default; any alternative is explicit in the Spec and recorded in the Plan."

- id: ADR2-U1
  statement: "The optimiser never shrinks text to fit; typography is fixed paper-space input."
  detail: "It first reflows, changes view selection, adds a section/detail, selects another standard scale or enlarges the sheet. Style is in paper units (conceptually font_size 3.0, arrow_length 3.0, text_gap 1.0, extension_offset 1.0); a different font size only via explicit style policy (archive 0018 §7). Listed as Unguarded in ADR 2."
  class: drafting
  source:
    adr: "ADR 2 Unguarded; archive 0018 §7"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: style is a Spec input in paper units; add a guard test (none exists in Python)."

# ---------------------------------------------------------------------------
# ADR 3 - The recognition boundary
# ---------------------------------------------------------------------------

- id: ADR3-D1
  statement: "Recognition reasons about geometry, drafting reasons about drafting: the provider ships no drafting policy and Draftwright never rescans topology to second-guess a record."
  detail: "Consumers take one of three paths: main-part analysis uses the build's cached aggregate; a standalone API or a separate shape may use a standalone recogniser; a bounded face question uses quiddity.inspection."
  class: machinery
  source:
    adr: "ADR 3 Decision"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R2 and quiddity-rust: quiddity owns recognition, analyse consumes its records, and plan never scans the B-rep for features."
  port_note: "Translate: quiddity-rust owns recognition; draftwright-rust's analyse step consumes its records and never re-scans B-rep for features."

- id: ADR3-1
  statement: "Recognition executes in the provider, never in Draftwright."
  detail: "Main-part consumers use the aggregate; standalone call sites are an exact roster with one reviewed reason each; src/draftwright/recognition/ is a re-export facade."
  class: machinery
  source:
    adr: "ADR 3 invariant 1"
    issues: []
    tests: ["test_external_recognition_boundary.py", "test_quiddity_lifecycle_boundary.py", "test_counting_calls.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The crate boundary: no recognition code in draftwright-rust."
  port_note: "Translate: crate boundary quiddity (recognition) vs draftwright (drafting); no recognition code in the drafting crate."

- id: ADR3-2
  statement: "One recognition aggregate per build; zero for a declared render."
  detail: "An automatic build calls build_recognition_evidence exactly once; a declared build/render calls nothing; first physical critique/export obtains at most one cached aggregate; repeated lint adds no call."
  class: machinery
  source:
    adr: "ADR 3 invariant 2; archive 0017 Accepted Contract §6"
    issues: []
    tests: ["test_detect_once.py", "test_declared_recognition_gate.py", "test_recognition_result.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): analyse runs recognition once; plan and render never do. The \"none for a declared render\" half is retired with ADR4-3."
  port_note: "Translate: analyse() runs recognition once and its Analysis document is reused; planning a fully declared Spec needs no recognition, lint may request Analysis once."

- id: ADR3-3
  statement: "Consumers project the one recognition result; they do not rescan."
  detail: "Lint, model construction and reports read the cached result or a pure function of it; shared substrates (cylinder inventory, risers) are scanned once and reused."
  class: machinery
  source:
    adr: "ADR 3 invariant 3"
    issues: []
    tests: ["test_detect_once.py", "test_issue_958_cross_solid_recognition.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The Analysis is passed to plan and lint by reference."
  port_note: "Translate: Analysis is computed once and passed by reference to plan and lint."

- id: ADR3-4
  statement: "The provider join is fail-closed: every consumed family, record type and schema version is validated against the installed provider's manifest, and a mismatch fails the build."
  detail: "The exact provider version is pinned."
  class: trust
  source:
    adr: "ADR 3 invariant 4"
    issues: []
    tests: ["test_recogniser_capabilities.py", "test_inspection_contract.py"]
  status: pending
  port_note: "Keep: Analysis records the quiddity version/schema; draftwright refuses an Analysis with an unknown schema version."
  rust_test: tests/trust_rules.rs::a_document_of_an_unknown_version_is_refused
  rust_note: "In part: plan refuses an Analysis or a Spec of a schema it does not read (fixed here in src/model.rs: a spec of another version was read as spec/1 and rewritten as one), the bridge refuses recognition JSON of another format and any record type it has no home for (tests/bridge.rs::refusals_and_evidence_are_not_features), and haecceity is pinned in Cargo.lock. The native reader of Rust quiddity's recognition document (src/bridge/native.rs) checks all three: it refuses a schema version other than quiddity-rust/recognition/1, a family or record type that schema does not have, other than file coordinates, and a face count that is not the part's (tests/native.rs::the_reader_refuses_what_it_does_not_know); its table must equal the provider's (tests/native.rs::the_reader_knows_the_providers_schema), and quiddity is pinned in Cargo.lock to haecceity's commit (tests/native.rs::quiddity_and_haecceity_are_pinned_together). Not yet on every path: the native reader is tested but not live (analyse still takes every family from the bridge), and on the bridge path the quiddity document's own format_version and family names are not checked (the bridge reads past them), nor the recogniser's version (recorded as recognition.recogniser, not pinned or compared)."

- id: ADR3-5
  statement: "Every recognition record type has exactly one home: a typed adapter, an explicit consumer disposition, or a refusal."
  detail: "Universe derived from the provider's public return annotations, partitioned with no gap and no overlap."
  class: machinery
  source:
    adr: "ADR 3 invariant 5; archive 0013 Amendment 3"
    issues: [752]
    tests: ["test_detect_registry.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): A closed match over quiddity's record types that fails the read on an unknown one (same mechanism as ADR1-5)."
  port_note: "Translate: exhaustive match over the quiddity record enum."

- id: ADR3-6
  statement: "No provider object crosses the drafting-model waist; provider face/feature references never enter the IR, plan, placement, scripts or output."
  class: spec
  source:
    adr: "ADR 3 invariant 6"
    issues: []
    tests: ["test_import_boundaries.py (test_linting_does_not_import_model)", "test_occurrence_recognition_ownership.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Spec and Plan name features by draftwright IDs. A quiddity fingerprint may sit in a Spec anchor as data (R3); a quiddity reference or face index never keys a Spec entry."
  port_note: "Translate: Plan and Spec reference features by draftwright stable ids, never by quiddity-internal topology references."

- id: ADR3-7
  statement: "Occurrence ownership is captured at conversion, by identity; equal values, order, labels, coordinates, face overlap and topology indices establish nothing."
  detail: "An expected owner that did not reach the final model is unexpectedly_missing, never silently represented; an occurrence Draftwright cannot account for is reported as such, never dropped from the count."
  class: trust
  source:
    adr: "ADR 3 invariant 7 and Decision; archive 0017 Amendments 12-19"
    issues: []
    tests: ["test_occurrence_recognition_ownership.py", "test_pattern_ownership.py", "test_nested_recognition_ownership.py", "test_channel_ownership.py", "test_turned_step_ownership.py", "test_through_step_ownership.py", "test_boss_ownership.py", "test_plate_ownership.py"]
  status: pending
  port_note: "Keep: analyse records, per recognised occurrence, its disposition and owning feature id at conversion time; Analysis carries the ledger."
  rust_note: "Not ported: the bridge gives every quiddity record one home (feature, evidence or refusal) and refuses one it has none for, but the Analysis carries no per-occurrence disposition or owning feature, so an occurrence the plan then does not use (a record type draftwright leaves undimensioned) is not accounted for as such."

- id: ADR3-8
  statement: "Ownerless policy is explicit per occurrence and comes from one source: families not drawn carry unsupported, deferred or evidence_only with a closed reason code."
  detail: "Projected from the same capability declaration the contract validates, never a second registry."
  class: trust
  source:
    adr: "ADR 3 invariant 8; archive 0017 Amendment 14"
    issues: [1245]
    tests: ["test_recognition_policy_dispositions.py", "test_issue_1245_passage_disposition.py", "test_issue_1246_prismatic_pocket_disposition.py", "test_issue_1247_angled_step_disposition.py"]
  status: pending
  port_note: "Keep: one capability table in draftwright-rust drives both conversion and the per-occurrence disposition in Analysis."
  rust_note: "Not ported: no capability table gives each family not drawn a disposition (unsupported, deferred, evidence_only) with a closed reason; the bridge's record-type table (bridge::home) and the planners' kinds (dims::PLANNERS) are two lists. Whether records draftwright leaves undimensioned are reported by the plan or by lint is an open maintainer question (docs/next-session.md, d-dims-split)."

- id: ADR3-9
  statement: "Recognition is geometry-only; PMI lowering may change which feature owns a record but never what was recognised."
  detail: "Records are frozen, JSON-serialisable geometry with no CAD-kernel type inside; drafting policy never enters the provider."
  class: machinery
  source:
    adr: "ADR 3 invariant 9"
    issues: []
    tests: ["test_recogniser_contract.py", "test_external_recognition_boundary.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): quiddity records serialise into the Analysis; PMI is merged by draftwright, not quiddity."
  port_note: "Translate: quiddity records serialise into Analysis JSON; PMI merge happens in analyse/spec, not in quiddity."

- id: ADR3-10
  statement: "The framed boundary is one owned intake with typed refusal: it returns frame, working solid and result together, or a refusal; never a guessed axis, never a raw run inside the adapter."
  detail: "prepare_framed_detection calls the provider once, classifies the returned local solid, recognises once. Records stay in the frame in which they were proved."
  class: trust
  source:
    adr: "ADR 3 invariant 10; archive 0020 §1-4"
    issues: [1357]
    tests: ["test_issue_1357_framed_boundary.py", "test_issue_1357_framed_activation.py", "test_issue_1357_pmi_frame.py"]
  status: pending
  port_note: "Keep: if the port adopts framed recognition, a frame refusal is a typed Analysis outcome, not a fallback hidden in the adapter."
  rust_note: "Not applicable yet: the port does not use framed recognition. The bridge records quiddity's working frame (Analysis.recognition.frame) and reads parameters through it; there is no frame refusal to type. Owed when Rust quiddity's framed preparation is consumed."

- id: ADR3-11
  statement: "Frame gauge limits semantic claims, not geometry: ORTHOGONAL and AXIAL frames do not establish authored side or material-axis identity."
  detail: "FULL establishes a directed ordered basis; ORTHOGONAL leaves sign/axis interchange unobservable; AXIAL also leaves roll unobservable (archive 0020 §3)."
  class: trust
  source:
    adr: "ADR 3 invariant 11; archive 0020 §3"
    issues: []
    tests: ["test_issue_1357_framed_boundary.py"]
  status: pending
  port_note: "Keep: Analysis records the frame gauge; the planner does not derive side/handedness facts the gauge cannot support."
  rust_note: "Not ported: the Analysis records quiddity's frame but no gauge (FULL, ORTHOGONAL, AXIAL). No planner reads side or handedness from the frame yet, so nothing claims what a gauge would forbid."

- id: ADR3-12
  statement: "Plural turned profiles are one compiler input: no consumer selects the first profile or merges disjoint bodies, and a groove that cannot name one owner is refused."
  class: drafting
  source:
    adr: "ADR 3 invariant 12; archive 0020 §5"
    issues: [354]
    tests: ["test_issue_1357_plural_turned_profiles.py"]
  status: pending
  port_note: "Keep: Analysis carries every turned body; planner handles them independently."

- id: ADR3-13
  statement: "A second consumer of one recognition run costs no second run: the evidence projector never recognises, imports geometry or reads the filesystem."
  class: machinery
  source:
    adr: "ADR 3 invariant 13"
    issues: []
    tests: ["test_issue_1460_step_inspection.py", "test_sheet_generation_snapshot.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Reports and spec export are pure functions of an existing Analysis."
  port_note: "Translate: reports and spec export are pure functions of an existing Analysis."

# ---------------------------------------------------------------------------
# ADR 4 - Declared intent
# ---------------------------------------------------------------------------

- id: ADR4-D1
  statement: "A hybrid (detect, then override specific features) is first-class; declaration is for where the caller knows better than detection."
  class: spec
  source:
    adr: "ADR 4 Decision; archive 0011 Decision 3"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R1 decision: Spec entries override or add to Analysis features by stable ID."
  port_note: "Translate: Spec entries override or add to Analysis features keyed by stable feature id; a fully declared Spec is the degenerate case."

- id: ADR4-D2
  statement: "The editable output mirrors the planner's intent line for line, never the placed annotations, so solver pressure can never rewrite version-controlled source."
  detail: "A dimension that does not fit stays in the intent with a placed=false outcome; a later scale or page change can make it fit with no edit (archive 0016 'The script records intent, not what got placed')."
  class: trust
  source:
    adr: "ADR 4 Decision; archive 0016"
    issues: []
    tests: []
  status: ported
  port_note: "Keep: the Spec is never rewritten from Plan outcomes; placement results live only in the Plan."
  rust_test: tests/trust_rules.rs::planning_never_writes_its_outcomes_into_the_spec
  rust_note: "plan returns the spec it was given with only its binding set (to the analysis's, or kept across a revision while entries are inactive); an item that cannot be drawn stays in the spec and is a problem in the plan; no operation writes plan outcomes into a spec."

- id: ADR4-D3
  statement: "A view= or side= on a dimension is a derived-with-override routing hint, not a placement; intent never chooses a view, strip or coordinate."
  class: spec
  source:
    adr: "ADR 4 Boundaries; archive 0016 'Dimensions are sheet-level'"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): An optional view or side hint on a Spec dimension entry; the Plan records whether it was honoured."
  port_note: "Translate: Spec dimension entries may carry an optional view/side hint; the Plan records whether the hint was honoured."

- id: ADR4-D4
  statement: "Recognition breadth equals editable-vocabulary breadth: the edit surface can only name what the recognisers detect."
  class: spec
  source:
    adr: "ADR 4 Boundaries; archive 0001 Amendment 1"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The Spec's feature kinds are the Analysis's feature kinds."
  port_note: "Translate: Spec feature vocabulary equals the Analysis feature vocabulary."

- id: ADR4-1
  statement: "No authoring surface carries page geometry: a dimension line names a feature and a measurement and carries no number."
  detail: "The emitter reads the addressable plan, not the drawing; the engine derives every value from the referenced geometry."
  class: spec
  source:
    adr: "ADR 4 invariant 1"
    issues: []
    tests: ["test_compiled_plan_boundary.py (test_the_emitter_reads_only_the_addressable_result)", "test_sheet_emit.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R1 invariant 1. Anchor-relative placement (side, offset) is allowed: an offset is paper millimetres from the anchor, a request the layout honours where it can and otherwise reports as a problem, never a bounds override (decided 2026-10-07)."
  port_note: "Translate: Spec schema has no page coordinates and no dimension values; validate by schema."

- id: ADR4-2
  statement: "Detection and declaration emit the same IR into the same model; declared features render with the furniture detection would produce."
  detail: "No renderer branches on producer."
  class: machinery
  source:
    adr: "ADR 4 invariant 2"
    issues: []
    tests: ["test_declare.py", "test_part_model.py", "test_issue_1350_detected_takeover.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Parity test: a Spec that declares exactly the detected features gives the same Plan."
  port_note: "Translate: parity test - a Spec that declares exactly the detected features produces the same Plan as the detected build."

- id: ADR4-3
  statement: "A declared build performs no recognition."
  class: machinery
  source:
    adr: "ADR 4 invariant 3 (= ADR 3 invariant 2)"
    issues: []
    tests: ["test_declared_recognition_gate.py"]
  status: retired
  why: "R4 (accepted 2026-10-07): Differs from port note. Every plan starts from an Analysis, which is also where the geometry is read; there is no separate declared mode to keep free of recognition, and haecceity makes recognition cheap (R2). Confirmed 2026-10-07: every plan starts from an analysed part."
  port_note: "Translate: plan() on a fully declared Spec does not require an Analysis."

- id: ADR4-4
  statement: "Renderers emit dimensional content only from the compiled plan; no renderer formats a number the compiler did not."
  detail: "ApprovedDimension has no suppressed field; the feature crosses as an opaque ref; exceptions render source-authored document PMI verbatim (general tolerance, default surface finish, document notes, GD&T, raw PMI)."
  class: trust
  source:
    adr: "ADR 4 invariant 4; archive 0016 Amendment 1"
    issues: [923]
    tests: ["test_compiled_plan_boundary.py", "test_label_provenance.py (test_no_renderer_formats_a_number_the_compiler_did_not, test_the_ratchet_actually_bites)"]
  status: pending
  rust_test: tests/dimension_rules.rs::renderers_draw_only_from_the_plan
  rust_note: "Ported for dimensions and callouts (src/dims/mod.rs: render draws each item's planned terms and ink). No PMI text exists yet."
  port_note: "Keep: renderers read only Plan entries' text; author-supplied PMI/GD&T text is carried verbatim in the Plan with a 'source-authored' basis."

- id: ADR4-5
  statement: "Dimension intent has exactly two explicit sources: automatic or a complete authored set; mixing them raises, requesting neither raises, and augmenting requires the automatic source."
  detail: "Omission means suppression only inside a set declared complete. 'Implicit-by-usage' (any declared dimension turns automatic off) was rejected as action at a distance (archive 0016)."
  class: spec
  source:
    adr: "ADR 4 invariant 5; archive 0016 'Two explicit sources of dimension intent'"
    issues: [933]
    tests: ["test_add_dimension.py", "test_sheet_identity_invariant.py (test_dimension_intent_verb_roster_is_closed)"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): A Spec dimension_source (auto, authored); an authored set is complete; invalid combinations are validation errors. Decided 2026-10-07: keep both modes, defaults by default and an opt-in complete set. In the Spec schema as dimension_source (auto | authored) with dimensions keyed by ID; an omission inside an authored set, an unknown ID and an unknown source are refused."
  rust_test: tests/dimension_rules.rs::both_dimension_sources_and_their_validation
  port_note: "Translate: Spec has an explicit dimension_source {auto, authored}; authored lists are complete; auto may carry additions; invalid combinations are Spec validation errors."

- id: ADR4-6
  statement: "Dimension identity is the parameter id, derived and never positional; a bare role naming more than one measurement is refused, and an ambiguous selector raises rather than guessing."
  detail: "role.kind[.discriminator] uniformly (bore.diameter, grid_pitch.length.row); kind always included so an id never depends on sibling parameters; discriminator is row/col not x/y because a grid may be rotated; list position and UUIDs rejected; ids readable and stable across re-detection (archive 0016 Dimension identity, Amendment 3)."
  class: trust
  source:
    adr: "ADR 4 invariant 6; archive 0016 Amendment 3"
    issues: [869, 870, 871]
    tests: ["test_parameter_id.py", "test_dimension_role_vocabulary.py", "test_add_dimension.py (test_an_ambiguous_role_raises_rather_than_guessing)"]
  status: ported
  port_note: "Keep: stable Spec/Plan ids use the same derived scheme so Python-era ids map one-to-one."
  rust_test: tests/trust_rules.rs::dimension_ids_are_derived_and_a_bare_role_is_refused
  rust_note: "Over the fixture parts and the sampled corpus parts, every ID is d:<feature>/<role.kind[.discriminator]>@<view>, unique, naming a recognised feature, pattern or the envelope, and unchanged when recognition reports its features in reverse order (feature IDs: tests/bridge.rs::ids_are_unique_stable_and_independent_of_discovery_order). The spec addresses a dimension only by its whole ID, so no selector can be ambiguous: a bare role or an unknown ID is refused with the nearest IDs. The parameter names are draftwright's, compared fact by fact in tests/dimensions.rs."

- id: ADR4-7
  statement: "Suppression changes what is shown, never what the drawing asserts: no renderer derives an engineering fact from a parameter's absence."
  detail: "A blind hole never reads THRU because its depth was omitted; facts live on the feature, parameters carry values for display; a compound callout's head cannot be suppressed while its dependents remain (raises)."
  class: drafting
  source:
    adr: "ADR 4 invariant 7; archive 0016 'Suppression changes what is shown'"
    issues: []
    tests: ["test_suppression_marks.py"]
  status: pending
  rust_test: tests/dimension_rules.rs::blind_and_through_holes_are_separate_requirements
  rust_note: "THRU is read from the feature's bottom, never from a missing depth. A callout is one plan item, so no term of it can be suppressed alone yet; the head-without-dependents validation arrives with per-term overrides."
  port_note: "Keep: feature facts (through, thread) live on the feature in Analysis/Spec; Plan omission of a parameter never changes them; head-without-dependents is a Spec validation error."

- id: ADR4-8
  statement: "Authored omission and planner suppression are distinct ledger rows."
  class: trust
  source:
    adr: "ADR 4 invariant 8 (= ADR 5 invariant 8)"
    issues: []
    tests: ["test_suppression_ledger.py (test_an_authored_omission_is_distinguished_from_a_rule_suppression)"]
  status: pending
  port_note: "Keep: Plan omissions carry basis 'authored' vs 'rule:<name>'."
  rust_test: tests/dimension_rules.rs::both_dimension_sources_and_their_validation
  rust_note: "In part: every authored omission is a row in the plan's omitted, with basis 'authored: …' (and 'inactive: …' across a revision). The planner suppresses nothing by rule yet (ADR1-8's conveyed_by is not ported), so there is no rule row to tell apart; when one is, it must be an omitted row with basis 'rule:<name>'."

- id: ADR4-9
  statement: "Nothing the plan approves may vanish silently: a tolerance reaches the ink through the label, and an undrawable approved mark is reported against its measurement."
  class: trust
  source:
    adr: "ADR 4 invariant 9; archive 0016 Amendment 6"
    issues: [1215, 1234, 1216]
    tests: ["test_issue_1215_no_approved_tolerance_is_dropped.py"]
  status: pending
  rust_test: tests/dimension_rules.rs::nothing_approved_vanishes_when_its_view_is_omitted
  rust_note: "An undrawable item stays in the plan unplaced, with a view_plan_incomplete problem naming it. Tolerances are not planned yet."
  port_note: "Keep: every approved Plan dimension is either placed or has a problem with its id; a test joins Plan entries against rendered output."

- id: ADR4-10
  statement: "A contingency is approved content, not a renderer's inference: a fallback is compiled, carried inactive, and released only when the primary places nothing."
  detail: "Case: a Z-turned part's overall height released only if the whole step chain places zero marks. An authored omission prevents the contingency from being compiled; a surviving primary leaves it inactive; contingencies are addressable (archive 0016 Amendment 5)."
  class: trust
  source:
    adr: "ADR 4 invariant 10; archive 0016 Amendment 5"
    issues: [955]
    tests: ["test_issue_955_height_contingency.py"]
  status: pending
  port_note: "Keep: Plan carries contingent entries with a 'contingent_on <id>' basis; activation is a planner decision recorded in the Plan."
  rust_note: "Not ported: there are no contingent plan items; the port plans no step chain for a Z-turned part, so Python's case (the overall height released when the chain places nothing) does not arise yet."

- id: ADR4-11
  statement: "Edits are scale-independent intents in the shared solve: pin and priority, never raw coordinates; the raw single-slot placement verb survives only as a deprecated escape hatch."
  detail: "dimension(..., pin=, priority=) drained by finalize() through _PASS_SEQUENCE; place_dim is the deprecated raw fallback."
  class: spec
  source:
    adr: "ADR 4 invariant 11; archive 0012"
    issues: [511]
    tests: ["test_issue_563_placement_intent.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Spec placement is anchor-relative (side, offset, order) plus pin and priority, and stays a request to the solver (ARCH0012-1). There is no raw-coordinate escape hatch and no drain."
  port_note: "Translate: Spec dimension entries carry optional pin/priority; there is no raw-coordinate escape hatch and no finalize drain."

- id: ADR4-12
  statement: "Sheet identity is invariant between declaration and build: a mutation after declaration is invisible, materialisation is idempotent, and the verb and handle rosters are closed."
  class: machinery
  source:
    adr: "ADR 4 invariant 12"
    issues: []
    tests: ["test_sheet_identity_invariant.py"]
  status: retired
  why: "R4 (accepted 2026-10-07): The Spec is an immutable JSON value; there is no fluent builder to mutate."
  port_note: "Retire: Spec is an immutable JSON document; there is no fluent builder to mutate."

- id: ADR4-13
  statement: "Generated editable output executes what it emits for every kind and fabricates no geometry."
  detail: "A detected part is emitted as numbers at a part-seam, never as reconstructed build123d objects (reconstruction rejected on principle: a wrong solid masquerades as the part); a live-source reference is emitted only on a polarity-checked one-to-one match (archive 0011 Amendments 1, 4)."
  class: trust
  source:
    adr: "ADR 4 invariant 13; archive 0011 Amendment 1, Amendment 4"
    issues: [1041]
    tests: ["test_sheet_emit.py", "test_script_detail_parity.py", "test_e2e_standards.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The script emitter is gone. A Spec exported from a Plan re-plans to the same Plan, and cannot hold geometry (R1 invariant 1)."
  port_note: "Translate: the script emitter is retired; the rule becomes 'a Spec exported from Analysis round-trips to the same Plan and never invents geometry'."

- id: ADR4-14
  statement: "Authored views with automatic dimensions is refused: requirements determine views, not the reverse."
  class: spec
  source:
    adr: "ADR 4 invariant 14; archive 0018 Amendment 1"
    issues: [1260]
    tests: ["test_issue_1260_view_constraints.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Differs from port note, which would refuse the combination. Omitting a view is already allowed with default dimensions; instead, a dimension no remaining view can carry is a view_plan_incomplete problem naming the view to restore (ADR2-12). Decided 2026-10-07."
  port_note: "Translate: Spec validation error when view_source=authored and dimension_source=auto (augmenting views remain legal)."

- id: ADR4-15
  statement: "Automatic dimensioning is the detected front door and carries no warning; on the declarative surface authored dimensions are preferred and automatic is soft-deprecated with no removal date."
  class: machinery
  source:
    adr: "ADR 4 invariant 15; archive 0016 Amendment 4"
    issues: [1043]
    tests: ["test_soft_deprecation.py"]
  status: retired
  why: "R4 (accepted 2026-10-07): The deprecation mechanics have no counterpart. analyse then plan with an empty Spec is the automatic drawing (R1)."
  port_note: "Retire the warning mechanics; translate as: analyse->plan with no Spec gives the automatic drawing, and exported Specs are authored."

- id: ADR4-U1
  statement: "Over-dimensioning that is neither identical nor coincident (for example a pattern's per-hole locations and its pitch) should be reported."
  detail: "Listed as Unguarded/Open in ADR 4 and ADR 5: the redundancy lint does not exist."
  class: drafting
  source:
    adr: "ADR 4 Unguarded; ADR 5 Open; archive 0016 'Preventing duplicate dimensions'"
    issues: []
    tests: []
  status: pending
  port_note: "Keep as a target: a redundancy check over Plan dimensions emitting a structured problem; not implemented in Python."

# ---------------------------------------------------------------------------
# ADR 5 - Trust and honest failure
# ---------------------------------------------------------------------------

- id: ADR5-D1
  statement: "A guard is load-bearing only when breaking the rule on purpose fails a named test; a green suite proves nothing about a guard that was never mutated."
  detail: "Guard the claim, not a proxy; a boundary guard compares against the compiler, not against a pattern that looks like what the compiler would produce (archive 0017 'What Phase 1 Taught', 0016 Amendment 6)."
  class: trust
  source:
    adr: "ADR 5 Decision; archive 0017, 0016 Amendment 6"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: each ported rule's guard test should be shown to fail under a deliberate mutation."
  rust_note: "A practice, not a property a test can hold. The guards in tests/trust_rules.rs were shown to fail under a deliberate break before being kept (the STEP file read twice; the staged copy left behind; the schema check removed); lint's guard has its own (the_guard_catches_what_it_should)."

- id: ADR5-D2
  statement: "No machine-readable document infers material, process, finish, thread, fit or tolerance intent."
  class: trust
  source:
    adr: "ADR 5 Decision"
    issues: []
    tests: []
  status: ported
  port_note: "Keep: Analysis and reports state only recognised geometry and authored intent; manufacturing intent comes only from Spec or source PMI."
  rust_test: tests/trust_rules.rs::no_document_infers_manufacturing_intent
  rust_note: "With the default spec, every plan of the fixture parts and the sampled corpus parts has a title of the part's name and a drawing number only (no material), and prints only counts, sizes, symbols and the callout grammar's words: no fit, tolerance, thread or finish. Such intent enters only through the spec (sheet/title, dimensions/<id>/tolerance, features/<id>/fit); with them, only the authored items change, by exactly the authored band (tests/tolerances.rs::only_the_authored_bands_appear). No PMI is read yet."

- id: ADR5-1
  statement: "Same input, same sheet, every platform."
  detail: "Fonts bundled and referenced by path; the strip solver is _solve_strip_1d_pava with a lower-median tie rule; exports are reproducible; nothing samples, rasterises or searches stochastically."
  class: trust
  source:
    adr: "ADR 5 invariant 1 and Decision; archive 0006, 0009 Amendment 4"
    issues: [1196, 149]
    tests: ["test_export_reproducible.py", "test_issue_1196_deterministic_view_names.py"]
  status: pending
  port_note: "Keep: Rust output is deterministic; port as a reproducibility test over Plan JSON and rendered SVG/PDF bytes."
  rust_test: tests/timezone.rs::the_same_bytes_in_every_time_zone
  rust_note: "Ported in part: the same documents give the same SVG, DXF and PDF bytes run to run (tests/model.rs::the_same_documents_give_the_same_bytes) and under four time zones whose 1900 and present offsets differ (tests/timezone.rs). Not checked: bytes across operating systems and architectures, and the strip solver's PAVA lower-median tie rule."

- id: ADR5-2
  statement: "Lint derives no completeness denominator from the plan or the IR; it may compare a claim the drawing makes against the plan."
  detail: "Completeness starts from recognition and the placed drawing; comparing a claim against the plan contributes no denominator (archive 0015 amendment #1217)."
  class: trust
  source:
    adr: "ADR 5 invariant 2"
    issues: [1217]
    tests: ["test_import_boundaries.py (test_linting_does_not_import_model)", "test_issue_1217_the_facility_is_shared.py"]
  status: ported
  rust_test: lint_never_reads_the_plan_or_the_spec
  rust_note: "Hole coverage takes its requirements from the Analysis and its evidence from the rendered drawing's annotations; no claim is checked against the plan yet."
  port_note: "Keep: completeness = f(Analysis, rendered placement); claim-checking may read the Plan."

- id: ADR5-3
  statement: "Repair is an allowlisted, idempotent safety net that never executes an arbitrary suggestion; the structural cure for a collision class remains a placement rule."
  detail: "Handles dim_inside_part and the axis-aligned annotation_ink_overlap class; uses the shared bounded solver; accepts only strict improvement with no increased lint component, preserving requirements, measurement claims, membership and pins; rejection restores the original; infeasible choices retain explicit findings. Maintainer-approved 2026-09-07 (#1490)."
  class: trust
  source:
    adr: "ADR 5 invariant 3; archive 0002"
    issues: [1490]
    tests: ["test_repair.py (test_repair_dim_inside_part_flips_side, test_repair_idempotent_on_clean_drawing, test_repair_does_not_increase_issue_counts)", "test_issue_1333_bounded_ink_repair.py"]
  status: pending
  port_note: "Translate: prefer fixing placement in the planner; if a repair pass is ported it operates Plan->Plan with the same acceptance rules."
  rust_note: "Not ported: plan has no repair step (R4 decision 6: allow-listed, idempotent, accepted on strict improvement and recorded); collisions are reported as problems only."

- id: ADR5-4
  statement: "Provenance is recorded once, at the render seam, for every feature kind: the annotations of a feature are exactly what dropping it removes."
  detail: "No pass resolves a feature from an annotation name. dimension() is symmetric with drop(): any parameter a feature exposes can be added back (archive 0010 Amendment 1)."
  class: trust
  source:
    adr: "ADR 5 invariant 4; archive 0010"
    issues: [408]
    tests: ["test_render_seam.py", "test_feature_provenance.py (test_drop_is_complete_for_a_multi_feature_prismatic_part, test_drop_is_complete_for_a_turned_part, test_drop_is_complete_for_side_drilled_holes)"]
  status: ported
  port_note: "Keep: every Plan annotation carries its feature id and dimension ids; rendered elements carry the annotation id."
  rust_test: tests/trust_rules.rs::annotations_carry_their_plan_items_provenance
  rust_note: "Each annotation on the drawing is one placed plan item, named by its ID and claiming exactly the measurements the item states (on plate, two_grids and ftc06); dropping a feature (omitting its dimensions by ID: the spec has no per-feature drop) takes off exactly the annotations that claim it, and listing an ID in an authored set adds it back (tests/trust_rules.rs::every_planned_dimension_can_be_addressed). Section furniture and the title block claim no feature."

- id: ADR5-5
  statement: "Quality is reported as components and completeness names its bound: no composite score; the completeness figure is audited_score."
  detail: "Components completeness, restraint, legibility, fidelity; audited_score with excludes and an unrecognised_geometry_reports floor; fidelity asks whether what the sheet says is true. The legacy scalar must not be an optimisation target (archive 0002)."
  class: trust
  source:
    adr: "ADR 5 invariant 5; archive 0002"
    issues: [1176, 1126, 1127]
    tests: ["test_quality_components.py (test_the_audited_score_carries_its_qualifier_in_its_own_name)", "test_issue_1176_quality_fidelity.py"]
  status: pending
  port_note: "Keep: quality report fields with the same names and bounds."
  rust_note: "Not ported: there is no quality report and no audited_score; the plan's problems and lint's findings are the only measures."

- id: ADR5-6
  statement: "A claim on the sheet is checked against the compiler, not against a pattern: a measurement the plan never approved is reported, and an approved tolerance reaches the ink verbatim."
  detail: "claimed_measurement_not_compiled."
  class: trust
  source:
    adr: "ADR 5 invariant 6"
    issues: [1217, 1215]
    tests: ["test_issue_1217_claimed_representations.py", "test_issue_1215_no_approved_tolerance_is_dropped.py"]
  status: pending
  port_note: "Keep: render output is checked against Plan text by id."
  rust_note: "Not ported: lint judges the drawing against the Analysis (hole coverage), not a claim's text against the plan item it names, so claimed_measurement_not_compiled has no counterpart. The renderer side is checked (tests/dimension_rules.rs::renderers_draw_only_from_the_plan); no tolerances are planned yet."

- id: ADR5-7
  statement: "An approved dimension that is not drawn is reported against its measurement, does not gate the build, and is retracted if a later pass draws it."
  detail: "overall_dim_withheld / step_dim_withheld carry the measurement identity."
  class: trust
  source:
    adr: "ADR 5 invariant 7; archive 0016 Amendment 6"
    issues: [1215]
    tests: ["test_issue_1215_envelope_tolerance.py", "test_issue_1215_no_approved_tolerance_is_dropped.py"]
  status: ported
  rust_test: tests/dimension_rules.rs::nothing_approved_vanishes_when_its_view_is_omitted
  port_note: "Keep: a placement drop is a Plan problem on that dimension id; since the Plan is computed whole, 'retraction' becomes 'only final outcomes are reported'."

- id: ADR5-8
  statement: "An authored omission is distinguishable from a planner omission: the suppression ledger names the rule or the author, one row per fact."
  class: trust
  source:
    adr: "ADR 5 invariant 8"
    issues: []
    tests: ["test_suppression_ledger.py (test_an_authored_omission_is_distinguished_from_a_rule_suppression)"]
  status: pending
  port_note: "Keep: Plan omission basis distinguishes authored vs rule."
  rust_test: tests/dimension_rules.rs::both_dimension_sources_and_their_validation
  rust_note: "In part, as ADR4-8: authored omissions are rows with basis 'authored: …'; the planner suppresses nothing by rule yet, so there is no rule row to tell apart."

- id: ADR5-9
  statement: "A report refuses rather than shrinks its denominator, and serialises no identity meant to survive another run."
  detail: "Unclassified occurrence, foreign result, absent model or missing ownership raises ReportUnavailableError; IDs are document-local; no FeatureRef, FaceRef, topology index or object address; NaN/Infinity rejected."
  class: trust
  source:
    adr: "ADR 5 invariant 9; archive 0017 Amendment 21"
    issues: []
    tests: ["test_report_projection.py"]
  status: pending
  port_note: "Keep: report generation returns an error rather than a partial document; no quiddity-internal ids in JSON. Note tension with Spec stable ids - those are draftwright-owned, not recognition identities."
  rust_note: "Not ported: there is no report. The documents hold draftwright IDs and face indices bound to one file by source_sha256, as R4's reading allows. Not checked: a non-finite number in a document would be written by serde_json as null, not refused."

- id: ADR5-10
  statement: "Report persistence is explicit and atomic: a failure leaves the destination untouched, and export does not write reports as a side effect."
  detail: "write_report flushes a sibling temporary and replaces."
  class: trust
  source:
    adr: "ADR 5 invariant 10; archive 0017 Amendment 22"
    issues: []
    tests: ["test_report_writer.py"]
  status: ported
  port_note: "Keep: atomic write for every JSON document (Analysis/Spec/Plan/report)."
  rust_test: tests/trust_rules.rs::a_failed_write_leaves_the_destination_as_it_was
  rust_note: "Every file the port writes is a rendered drawing, staged beside its place and renamed in (api::write); a failure leaves the destination as it was and now removes the staged copy (fixed here in src/api.rs; it was left behind), and no parent directory is made. render writes exactly the formats asked for. Documents are replied, not written; a report sidecar (R4 decision 5, --report) does not exist yet."

- id: ADR5-11
  statement: "Direct CLI rendering writes the report beside its output by default; --no-report opts out."
  detail: "A failed visual export does not create or update the sidecar (archive 0017 Amendment 25)."
  class: trust
  source:
    adr: "ADR 5 invariant 11; archive 0017 Amendment 25"
    issues: []
    tests: ["test_cli_report_sidecar.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Proposed 2026-10-07, built around what an LLM needs to fix a drawing. plan and review reply with everything needed: the problems, with their subjects and a suggested fix edit; the plan items they refer to, with their default flags and basis; and the spec. review adds a picture of the sheet with the problem regions marked, and what changed since the previous plan. render replies with the problems beside its files, and writes a sidecar only on request (--report)."
  port_note: "Translate: CLI writes Plan (with problems) and report beside rendered output by default."

- id: ADR5-12
  statement: "Generation-time evidence comes from one hashed byte snapshot: the source is resolved and read once, and every consumer reads a private copy."
  detail: "A->B->A replacement or symlink retargeting cannot split provenance from the generated model; only basename and SHA-256 are embedded."
  class: trust
  source:
    adr: "ADR 5 invariant 12; archive 0017 Amendment 24"
    issues: []
    tests: ["test_sheet_generation_snapshot.py"]
  status: ported
  port_note: "Keep: Analysis records the source file SHA-256 computed from the exact bytes analysed."
  rust_test: tests/trust_rules.rs::the_hash_and_the_geometry_come_from_one_read
  rust_note: "analyse reads the STEP file once and hashes and parses the same bytes; the test feeds it through a named pipe that would give another file to a second read (Unix only). Only the file's stem and hash are recorded. The recognition JSON is a second file, bound to the first by its source_sha256 (the bridge refuses another file's)."

- id: ADR5-13
  statement: "A clear result names its bound: bounded-clear when no assessed predicate needs attention, otherwise needs-attention; neither claims manufacturing readiness or complete recognition."
  class: trust
  source:
    adr: "ADR 5 invariant 13"
    issues: []
    tests: ["test_report_projection.py", "test_sheet_generation_snapshot.py"]
  status: pending
  port_note: "Keep: same status vocabulary in the report/Plan summary."
  rust_note: "Not ported: neither the plan nor review has a summary status (bounded-clear, needs-attention). Where it lives (the Plan or a report) is open; question in docs/next-session.md."

- id: ADR5-14
  statement: "Read-only evidence is a projection, never a build: inspection returns what recognition found and what was done with it without a drawing, plan, placement, render, export or score."
  class: trust
  source:
    adr: "ADR 5 invariant 14"
    issues: []
    tests: ["test_issue_1460_step_inspection.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): analyse alone is the inspection operation; the Analysis is the evidence."
  port_note: "Keep: analyse() alone is the inspection API; its Analysis document is the evidence."

- id: ADR5-15
  statement: "Evidence lives beside the editable intent, not inside it, and generation owns that path in both directions."
  detail: "Generation writes the evidence document or removes a stale one; a document it cannot state truthfully is logged and skipped rather than failing generation."
  class: trust
  source:
    adr: "ADR 5 invariant 15; archive 0017 Amendment 24 (superseded by Amendment 28)"
    issues: []
    tests: ["test_issue_1460_step_inspection.py", "test_sheet_generation_snapshot.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): Analysis and Spec are separate documents. Outputs embed the Spec (R1 invariant 8), never the Analysis."
  port_note: "Translate: Analysis (evidence) and Spec (intent) are separate documents; Spec never embeds Analysis."

- id: ADR5-16
  statement: "A document records the run options that determined it; two documents agreeing on source, producer and run options agree entirely."
  detail: "PMI lowering can rewrite a grouped hole member into a singleton owner, so source.sha256 alone does not imply reproducibility."
  class: trust
  source:
    adr: "ADR 5 invariant 16"
    issues: []
    tests: ["test_issue_1460_step_inspection.py"]
  status: pending
  port_note: "Keep: Analysis/Plan headers carry source hash, producer version and all options."
  rust_note: "Not upheld for the Plan: the Analysis records its source hash, its loader (producer and version) and the recognition it took in full, but the Plan records only the analysis's binding and the spec, so two plans of one STEP file under one spec, made with different --features JSON, agree on source, producer and options yet differ. Owed: the Plan names the recognition it was planned from; the field is a document-schema choice, asked in docs/next-session.md."

- id: ADR5-17
  statement: "An evidence document states what it cannot say: unclaimed geometry is not a missed feature, and what recognition rejected is reported as unavailable rather than as nothing."
  class: trust
  source:
    adr: "ADR 5 invariant 17; ADR 3 Unguarded"
    issues: []
    tests: ["test_issue_1460_step_inspection.py"]
  status: pending
  port_note: "Keep: Analysis has explicit 'unavailable' fields rather than empty lists for unknowns."
  rust_note: "In part: an Analysis made without recognition has no recognition field, and one made with it has the field even when nothing was recognised; quiddity's refusals are kept (recognition.refusals; tests/bridge.rs::refusals_and_evidence_are_not_features). Not ported: faces no feature claims are not stated, and nothing says which recognised families draftwright cannot draw."

- id: ADR5-U1
  statement: "Lint's coverage of everything a competent reviewer would flag is a goal, not a property; visual-channel defects are outside lint by definition."
  detail: "A blind spot is a silent pass; visual-channel issues (which row a section should cut) rest on a human or a vision reader (archive 0002)."
  class: trust
  source:
    adr: "ADR 5 Unguarded; archive 0002"
    issues: []
    tests: []
  status: pending
  port_note: "Keep as documented limitation in reports."
  rust_note: "A documented limitation (R4), not a check: docs/model.md says what lint and the collision checks do not cover, and review's picture is the visual channel. To be stated in the report once one exists."

# ---------------------------------------------------------------------------
# Archived ADRs - rules not captured by ADR 1-5 that still look relevant
# ---------------------------------------------------------------------------

- id: ARCH0002-1
  statement: "Lint codes are domain-meaningful, not layout-internal, so every finding is expressible as a domain fix."
  class: trust
  source:
    adr: "archive 0002 Consequences"
    issues: [29, 30]
    tests: []
  status: pending
  port_note: "Keep: Plan problem codes name drafting outcomes (feature_not_dimensioned, callout_dropped), not solver internals."
  rust_note: "Not ported: plan problem codes name drafting outcomes (annotation_overlap, view_plan_incomplete, section_not_shown, dimensions_not_ported, …) and most messages say what to change, but problems carry no fix edit (docs/model.md's fix; R4 decision 5), so 'every finding is expressible as a domain fix' is not checked."

- id: ARCH0002-2
  statement: "Deleting an authored dimension is not credited as an engineering-correct redundancy decision: it remains a visible suppressed requirement and scores as unplaced."
  detail: "Counting every authored omission as complete would make the metric gameable; an accepted waiver would need a distinct, explicit, reviewable provenance state."
  class: trust
  source:
    adr: "archive 0002 Consequences"
    issues: [1127]
    tests: []
  status: pending
  port_note: "Keep: completeness counts authored suppression as unplaced; a future 'waived' state must be explicit in the Spec."
  rust_test: tests/lint.rs::review_finds_the_plates_holes_stated_by_its_own_callout
  rust_note: "In part: an authored omission stays visible: it is a row in the plan's omitted, and lint, which reads the drawing and the Analysis, reports the omitted callout's requirements as missing. Not ported: there is no completeness score to count it as unplaced, and no waived state."

- id: ARCH0003-1
  statement: "A deliberate placement wins: a pinned annotation survives every later re-solve and repair never moves it."
  detail: "Realised as StripCandidate.anchored / _ANCHOR_WEIGHT; repair() refuses to move a pinned annotation."
  class: trust
  source:
    adr: "archive 0003 'Manual override must win'; 0005 §2"
    issues: [89, 547]
    tests: []
  status: pending
  port_note: "Keep: Spec pins are honoured by every plan() call and never altered by a repair step."
  rust_note: "Not ported: the spec has no pins, and there is no repair step that could move one."

- id: ARCH0003-2
  statement: "Edit locality: adding or nudging one annotation must not silently shift unrelated ones; an edit's blast radius is part of the editability contract."
  class: trust
  source:
    adr: "archive 0003 'Edit locality'"
    issues: []
    tests: []
  status: pending
  port_note: "Translate: re-planning after a small Spec edit should change only affected Plan entries; add a stability test (Plan diff size) since Python never guarded it."
  rust_note: "R4 translates it: a small spec edit changes only the affected plan items. Not upheld: lanes are packed in order, so omitting one item moves others. On plate.step with its recognition, omitting d:f:hole_pattern:1/grid_pitch.length.col@plan moves location.length.x and the bore callout; omitting location.length.x moves the callout. Owed in placement (src/dims/placement.rs, another stream's), with a stability test."

- id: ARCH0004-1
  statement: "Page packing follows projection alignment: plan above front sharing X, side beside front sharing Y; isometric and tables go in free rectangles."
  detail: "A global 2-D non-overlap solve was closed as unnecessary: most 2-D freedom is forbidden by projection alignment (#94)."
  class: drafting
  source:
    adr: "archive 0004 'Relationship to retired ADR 0003'"
    issues: [94]
    tests: []
  status: ported
  rust_test: views_keep_projection_alignment_and_their_areas_apart
  port_note: "Keep: principal-view arrangement is constrained by projection alignment in the planner (see ARCH0018-1 for first/third angle)."

- id: ARCH0004-2
  statement: "View blocks are packed disjoint: one block's annotations cannot enter another block's rectangle."
  detail: "Acceptance case: plan-view balloons must not overlap front-view dimensions (NIST CTC-02)."
  class: drafting
  source:
    adr: "archive 0004 Amendment 2026-06-20"
    issues: [121]
    tests: ["test_e2e_standards.py"]
  status: pending
  port_note: "Keep: plan validation asserts no cross-block annotation intrusion."

- id: ARCH0004-3
  statement: "An explicit scale below the view-legibility floor earns a warning, not a veto; only a sub-0.1 mm render floor is a hard rejection with a clean message."
  detail: "_MIN_VIEW_MM 10 mm is advisory for explicit scales and does not bound automatic scale; _MIN_RENDER_MM 0.1 mm is the unconditional geometry floor."
  class: drafting
  source:
    adr: "archive 0004 'The geometry legibility floor'"
    issues: [489]
    tests: []
  status: pending
  port_note: "Keep: Plan warning for small views at an explicit scale; Spec validation error below the render floor."

- id: ARCH0004-4
  statement: "Automatic page selection reserves authored table footprints before the flexible isometric and is not a 'smallest page on which lint happens to be clean' optimiser; a caller-forced page that places every requirement is honoured."
  class: drafting
  source:
    adr: "archive 0004 Amendment 2026-08-14 point 5"
    issues: [1146]
    tests: []
