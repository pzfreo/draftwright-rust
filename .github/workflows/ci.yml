name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "8"
  RUST_TEST_THREADS: "8"
  DRAFTWRIGHT_CORPUS: ${{ github.workspace }}/quiddity/tests/corpus
  DRAFTWRIGHT_CORPUS_REQUIRED: "1"

# fmt and clippy run beside the build; the build compiles every test binary once into a nextest
# archive, and the archive's tests run in parallel jobs. Every test of `cargo test --release`
# runs in exactly one of them (doc-tests, which nextest does not run, run in the build job).
jobs:
  # A pull request that changes only release metadata (versions, notes) runs lint alone;
  # tools/release_only.py says what counts. Pushes to main always run every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.check.outputs.release_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: check
        if: github.event_name == 'pull_request'
        run: python3 -I tools/release_only.py ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The corpus lives in the Python quiddity repository, pinned to a commit whose files match
      # the sha256 bindings of the recorded sheet facts and recognition fixtures.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      # The toolchain comes from rust-toolchain.toml.
      - run: rustup toolchain install
      # Caches ~/.cargo (registry and the git checkout of haecceity) and target/.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  build:
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: nextest@0.9.146
      - run: cargo nextest archive --release --archive-file nextest-archive.tar.zst
      - run: cargo test --doc --release
      # nextest's cargo test build also produces CARGO_BIN_EXE_draftwright. Reuse that
      # release executable and this job's pinned corpus in every acceptance job.
      - run: |
          test -x target/release/draftwright
          tar -czf acceptance-inputs.tar.gz target/release/draftwright quiddity/tests/corpus
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-inputs
          path: acceptance-inputs.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      # The session benchmarks' native p90 <= 150 ms bound is a go/no-go gate measured on the
      # development machine and enforced locally by `cargo test --release`; hosted runners are
      # about five times slower, so here the benchmarks print SESSION_LATENCY without asserting
      # it. Every other session assertion still runs.
      DRAFTWRIGHT_LATENCY_GATE: "0"
    strategy:
      fail-fast: false
      matrix:
        # Five nextest shards of the `ci` profile, and the binaries it leaves out run whole
        # under their own harness (.config/nextest.toml says why).
        shard: [1/5, 2/5, 3/5, 4/5, 5/5, harness]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      - run: rustup toolchain install
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: nextest@0.9.146
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive
      # The binaries carry the build job's absolute paths (CARGO_MANIFEST_DIR, CARGO_BIN_EXE_*,
      # CARGO_TARGET_TMPDIR), which are this job's too: the archive's target/ is extracted over
      # the workspace, and target/tmp, which cargo makes when it builds, is made here.
      - run: tar --zstd -xf nextest-archive.tar.zst && mkdir -p target/tmp
      - if: matrix.shard != 'harness'
        run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst
          --workspace-remap . --extract-to . --extract-overwrite
          --profile ci --partition hash:${{ matrix.shard }}
      # The binaries the `ci` profile's default filter leaves out, each run whole (`shell: bash`
      # adds pipefail).
      - if: matrix.shard == 'harness'
        shell: bash
        run: |
          left_out=$(cargo nextest list --archive-file nextest-archive.tar.zst \
            --workspace-remap . --profile ci --ignore-default-filter -E 'not default()' \
            --message-format oneline --color never | awk '{print $1}' | sort -u | sed 's/^draftwright:://')
          if [ -z "$left_out" ]; then
            echo "::error::the ci profile leaves no binary out; this job has nothing to run"
            exit 1
          fi
          for name in $left_out; do
            bin=(target/release/deps/$name-*)
            if [ ${#bin[@]} != 1 ] || [ ! -x "${bin[0]}" ]; then
              echo "::error::the archive does not hold exactly one $name test binary"
              exit 1
            fi
            "${bin[0]}"
          done

  acceptance:
    name: acceptance (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Hosted measurements: 342 s baseline + 432 s per pin cell. Each shard
        # measures a fresh same-binary baseline; nine shards enforce all 270 runs.
        include:
          - {job: quality-pins, label: quality-pins-1-1, pin_args: "--pin-cell 1-1", timeout: 30}
          - {job: quality-pins, label: quality-pins-1-3, pin_args: "--pin-cell 1-3", timeout: 30}
          - {job: quality-pins, label: quality-pins-1-8, pin_args: "--pin-cell 1-8", timeout: 30}
          - {job: quality-pins, label: quality-pins-2-1, pin_args: "--pin-cell 2-1", timeout: 30}
          - {job: quality-pins, label: quality-pins-2-3, pin_args: "--pin-cell 2-3", timeout: 30}
          - {job: quality-pins, label: quality-pins-2-8, pin_args: "--pin-cell 2-8", timeout: 30}
          - {job: quality-pins, label: quality-pins-3-1, pin_args: "--pin-cell 3-1", timeout: 30}
          - {job: quality-pins, label: quality-pins-3-3, pin_args: "--pin-cell 3-3", timeout: 30}
          - {job: quality-pins, label: quality-pins-3-8, pin_args: "--pin-cell 3-8", timeout: 30}
          # The 63-part survey runs as four interleaved slices of the sorted part
          # names (the slices partition the survey); each keeps the 3600 s per-call
          # budget, and the job limit stays at 120 min.
          - {job: repeated-spans, label: repeated-spans-1-4, pin_args: "--survey-shard 1/4", timeout: 120}
          - {job: repeated-spans, label: repeated-spans-2-4, pin_args: "--survey-shard 2/4", timeout: 120}
          - {job: repeated-spans, label: repeated-spans-3-4, pin_args: "--survey-shard 3/4", timeout: 120}
          - {job: repeated-spans, label: repeated-spans-4-4, pin_args: "--survey-shard 4/4", timeout: 120}
          - {job: mcp, label: mcp, pin_args: "", timeout: 10}
          - {job: plan-time, label: plan-time, pin_args: "", timeout: 30}
          # cgb243 and threaded_connector_109, the slow tail's renders (#43 item 3).
          - {job: render-tail, label: render-tail, pin_args: "", timeout: 30}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.job == 'mcp'
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-inputs
      - run: tar -xzf acceptance-inputs.tar.gz
      - run: python3 -I tools/ci_acceptance.py --job ${{ matrix.job }} ${{ matrix.pin_args }} --out target/acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acceptance-${{ matrix.label }}
          path: target/acceptance/
          if-no-files-found: error
          retention-days: 14

  wasm:
    name: Browser WASM and native parity
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Compare API/changelog with the PR base or previous main push.
      - run: python3 -m unittest discover -s tools -p 'test_wasm_safeguards.py'
      - name: Compare released quiddity pins (warning only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_quiddity_pin.py
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: wasm-pack build crates/draftwright-wasm --target web --profile wasm-release --locked
      - name: Check reviewed WASM API
        env:
          API_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python3 tools/check_wasm_api.py --base-ref "$API_BASE_REF"
      - run: cargo build --locked --release --example wasm_reference
      - run: node --test tools/wasm-parity.test.mjs
      - run: python3 tools/wasm_size.py crates/draftwright-wasm/pkg/draftwright_wasm_bg.wasm
