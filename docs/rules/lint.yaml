    lint_code: "step_material_mismatch"
    module: "linting/pmi_coverage.py"
    tests: [tests/test_title_block_units_format.py]
  status: retired
  why: "Rules assessment 2026-10-11: cannot arise on the plan path: the title block's material is the plan's own; warning when a spec value contradicts the model is LINT-code-step_material_disagreement, still open."
  port_note: "Keep."
  rust_note: "Not ported: the reading carries each part's material (`pmi::Report::materials`) and the title block's material cell is on the drawing, but which code applies, and whether an empty cell is a finding, turns on whether the caller authored the title field, which draftwright's lint is told and the port's lint cannot know: lint never reads the Spec (R1), and the drawing does not record a field's origin (a recorded maintainer question in docs/next-session.md). The title block does take the file's one usable material when the spec states none (draftwright's `_resolve_title_document_defaults`, tests/title_block_material.rs), and the cell's run then states its source (`pmi:material:<part>:0`), so the coverage lint does not report the material as not drawn; a title that does not state it (the spec gave another, or none was usable) is left to the reading's `pmi_not_extracted` (info)."

