    tests: [tests/test_issue_1370_double_d_completeness_evidence.py]
  status: pending
  rust_note: "Rules-text audit, 2026-10-16: Pending, owner: dimension-ownership stream. Double-D across-flats coverage is present in lint::profiled_bores. Spec-authored thread length is carried as a manufacturing aspect and prints MIN FULL THREAD (tests/spec_notes.rs), but lint::holes has no independent addressable thread-depth requirement; native Hole has no tap-depth field. Adding that parameter, head dependency and requirement denominator is protected ownership work, not grounds to retire a drafting requirement."
  port_note: "Keep: derive requirements from the feature's parameter list."

- id: LINT-hole_coverage-grouping_count
  statement: "A group of more than one identical hole states its quantity (n×), and the stated quantity equals the number of physical holes in the group."
  detail: "Synthetic requirement grouping.count. When one grouped callout covers several features, the printed total must agree with the per-feature allocations or no count is credited."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143, 92]
    tests: [tests/test_issue_1369_hole_completeness_evidence.py, tests/test_issue_1370_hole_pattern_completeness_evidence.py]
  status: ported
  rust_test: holes_drilled_from_opposite_faces_are_separate_groups
  rust_note: "Placed only when every member of the group is counted, as draftwright's _synthetic_placed: claimed (bore.diameter) by a callout whose printed quantity (its leading n×, or one when it prints none) is the number of holes it claims, all of them the group's; so a callout claiming one hole of a group counts that hole only, whatever it prints (ISSUE-1143-b; tests/issue_trust.rs::a_callout_certifies_only_the_holes_it_claims), and one callout claiming every member and printing their number states the quantity. The group's sizes and THRU still need one truthful statement on any member, as draftwright's _state. On Python's captured sheets, eight groups whose callout claims one draftwright hole feature owning every member read as one member claimed, since the sheet facts name the feature by one member's origin only: listed not-applicable in known_lint.json, with the members from draftwright's own drawing. The groups are the recognised patterns (Analysis.recognition.patterns) that bridge::holes::established_with accepts, and loose holes of one machining requirement. As in Python, a pattern is refused (its holes fall back to loose holes) only when its plane is oblique, its members share an axis line, or it is a bolt circle of fewer than five holes with nothing on its centre; a grid or linear pattern is one group however spaced (an_oblique_or_coaxial_pattern_is_not_established, recognised_patterns_are_the_groups). The port's dimensions also decline a grid that is not a lattice, or a linear pattern not evenly spaced, in its view, which Python's do not, so on such a part lint (with Python) expects the pattern's own count where the port's drawing may count it with other identical holes. An Analysis without a recognition record falls back to the fingerprints' pattern count and pitch, which cannot tell identical patterns apart (identical_patterns_are_grouped_as_recognised)."
  port_note: "Keep."

- id: LINT-hole_coverage-location
  statement: "Every hole is located from the datum in both directions perpendicular to its axis, and every member of a group is located."
  detail: "Z-axis holes: location.location.x and .y; off-axis holes: the in-plane coordinate and z (location_off_axis.*). Location requires every separately declared physical member to be tied to a placed location mark; per-axis requirements are counted independently (2 per hole). Through holes ignore their along-axis coordinate."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143, 883]
    tests: [tests/test_issue_1369_hole_completeness_evidence.py, tests/test_issue_1219_location_claims_its_own_axis.py]
  status: pending
  rust_test: tests/planned_hole_tables.rs::rows_and_tags_credit_hole_size_count_and_both_locations
  rust_note: "Stage H1: schedule X/Y cells credit both in-plane locations per member, each cell only for its own axis (a_changed_coordinate_cannot_borrow_a_number_from_another_cell); the ladder route keeps its earlier checks. Left pending until the whole family ledger is reviewed."
  port_note: "Keep."

- id: LINT-hole_coverage-turned_axis_location
  statement: "A cross hole lying on a turned part's axis is located along that axis by its centreline, and a centre mark in the hole's end-on view counts as locating it."
  detail: "Recorded as two requirements (location_off_axis.centerline.<in-plane> and .centerline.z) so the denominator does not shrink; the turned axis is recovered from external cylinders supporting the turned-step ladder (unique best support)."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143]
    tests: [tests/test_issue_1143_hole_completeness.py]
  status: retired
  why: "Rules assessment 2026-10-11: the coarse location backstop (LINT-code-feature_not_located) already enforces it."
  port_note: "Keep."

- id: LINT-hole_coverage-pattern_location
  statement: "A bolt circle, or a grid whose members prove a centred lattice, is located by its centre; a linear pattern or non-centred grid is located by one physical member, with pitch locating the rest."
  detail: "Parameters location_pattern.location.<in-plane axes>. Grid centre is credited only when every member matches its lattice site within 0.01 mm."
  class: drafting
  source:
    lint_code: "hole_requirement_missing"
    module: "linting/hole_coverage.py"
    issues: [1143]
    tests: [tests/test_issue_1370_hole_pattern_completeness_evidence.py]
  status: ported
  rust_test: member_ordinates_prove_pattern_location_and_spacing
  rust_note: "Stage G1 (src/lint/hole_patterns.rs): a missing pattern location is reported per in-plane axis (hole_pattern_missing_location_is_reported_per_axis); a location ordinate claimed on a member hole counts towards the pattern. As in Python, a bolt circle concentric with turned stock gets no centreline credit (spool132, undetermined in known_lint.json)."
  port_note: "Keep."

