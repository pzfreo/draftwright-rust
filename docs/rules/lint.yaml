  rust_note: "Stream K4, src/lint/leaders.rs (run by lint::lint): the tip is the first point of the drawn callout's leader (Drawn::lines), projected targets come from the Analysis's hole records (bridge::holes::Hole: opening, depth, recess and countersink diameters) and double-D records, through the view's recorded transform (Sheet::frames); tolerance 0.002 mm as draftwright. The defining edges are the occurrence's rim circles rather than the BRep's edges (the Analysis keeps face indices only); seen end-on, where the port calls a hole out, they coincide. A view without a recorded transform (a captured Python sheet) is not judged."
  port_note: "Keep: check leader tips against projected feature edges."

- id: LINT-code-diameter_leader_target_unverifiable
  statement: "When a diameter leader's target cannot be checked (no same-run recognition, no view, no exact ownership, or no boundary edges) the drawing says so rather than passing it."
