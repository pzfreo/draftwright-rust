- id: ARCH0018-1
  statement: "Projection convention (first or third angle) is a hard planning input: principal views keep their conventional side and alignment relationships, and a relational constraint that contradicts them is infeasible rather than silently repacked."
  detail: "Sections, details and NTS orientation views have the freedom drafting convention allows; an unconventional principal arrangement needs an explicit opt-out and the labelling to stay unambiguous. Listed as an Open delivery-gate item in ADR 2."
  class: drafting
  source:
    adr: "archive 0018 §4; ADR 2 Open"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: Spec projection_convention input; planner enforces arrangement; no Python guard yet."

- id: ARCH0018-2
  statement: "Among feasible plans, choose the largest appropriate preferred ISO 5455 scale, then the smallest standard sheet at that scale, then fewer redundant views and less waste, then the conventional arrangement."
  detail: "A smaller sheet whose geometry fits while dimensions drop is not a successful plan. Listed as an Open delivery-gate item in ADR 2."
  class: drafting
  source:
    adr: "archive 0018 §5; ADR 2 Open"
    issues: [1130]
    tests: []
  status: pending
  port_note: "Keep: deterministic candidate ordering in the planner."

- id: ARCH0018-3
  statement: "If no candidate plan is feasible, return the least-bad diagnostic drawing marked plan_infeasible with its specific outcomes; if nothing can be rendered at all, fail with the accumulated diagnostics."
  detail: "Ranking among infeasible results: fewest lost requirements, then unverifiable associations, then layout violations. Diagnostics distinguish infeasible authored constraint, no view exposes a requirement, view-eligible but dropped, unverifiable correspondence, deliberate NTS scale, and no complete candidate."
  class: trust
  source:
    adr: "archive 0018 §6, §9"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: Plan status 'infeasible' with structured problems; plan() errors only when nothing is renderable."
  rust_note: "In part: plan returns a plan with its problems whenever anything can be drawn, and refuses only a request that cannot be planned at all (every principal view omitted, an unknown view, size or scale); problems name the causes (view_plan_incomplete, views_do_not_fit, page_fit_uncertain, section_not_shown). Not ported: there are no candidate plans to rank and no plan_infeasible status."

- id: ARCH0018-4
  statement: "One drawing plans one physical sheet; extra sheets are never an implicit fallback for an infeasible single sheet."
  detail: "Multi-sheet needs numbering, cross-sheet requirement assignment and document-level title/revision semantics; ADR 2 Open records the explicit Document boundary for caller-authored member sheets (#1866)."
  class: drafting
  source:
    adr: "archive 0018 §5; ADR 2 Open"
    issues: [1866]
    tests: []
  status: pending
  port_note: "Keep: one Plan per sheet; multi-sheet only via an explicit document-level Spec."

- id: ARCH0018-5
  statement: "A whole-view pin anchors the projected view origin, not the annotation-dependent block bounds, so it survives label changes; an infeasible pin produces a diagnostic and never moves the anchor or drops content."
  class: drafting
  source:
    adr: "archive 0018 §2; ADR 2 Open"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: Spec view pin semantics."

- id: ARCH0018-6
  statement: "View intent mirrors dimension intent: an authoring set (omission suppresses), an augmenting addition (requires the automatic source), an explicit empty set, and requesting neither raises; sections and details are their own derived set."
  detail: "The ban is on authoring, not adding: augmenting views/sections are legal with automatic dimensions."
  class: spec
  source:
    adr: "archive 0018 Amendments 1-2"
    issues: [1260]
    tests: []
  status: pending
  port_note: "Translate: Spec view_source {auto, authored} with additions list; derived views (sections/details) as a separate list."

- id: ARCH0018-7
  statement: "A built drawing's views are never mutated after the build; the user edits the request and rebuilds."
  class: spec
  source:
    adr: "archive 0018 §2"
    issues: []
    tests: []
  status: pending
  port_note: "Translate: Plans are immutable outputs; edits go to the Spec and plan() reruns."

- id: ARCH0018-8
  statement: "Exporting a resolved plan as editable intent names semantic targets; if a section target cannot be named it fails with a named capability, and a raw cut coordinate is emitted only when the user authored it."
  class: trust
  source:
    adr: "archive 0018 §8; ADR 2 Open"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: Plan->Spec freeze/export refuses unnameable targets rather than emitting incidental coordinates."
  rust_note: "Not ported: there is no plan-to-spec export. The spec is written by the author or by edit, and holds no cut coordinate (section A–A's plane is derived by plan)."

- id: ARCH0019-1
  statement: "The plan carries display-complete label text (value, tolerance suffix, fit code, collapse wording); renderers render it and never compose it."
  detail: "Proposed (ADR 4 Open). Compound callouts assemble per-term display text. One formatter serves every site so limit-pair order is consistent and a fit class renders (archive 0016 Amendment 6)."
  class: trust
  source:
    adr: "archive 0019 §1 (Proposed); ADR 4 Open"
    issues: [1215, 1216]
    tests: ["test_issue_1215_no_approved_tolerance_is_dropped.py"]
  status: ported
  rust_test: tests/dimension_rules.rs::renderers_draw_only_from_the_plan
  rust_note: "Plan dimension entries carry `terms` and `label`; the renderer lays out the terms and composes no text."
  port_note: "Keep (adopt in the port): Plan dimension entries carry display_text; renderer test is string equality against it."

- id: ARCH0019-2
  statement: "A tolerance band that rounds to zero at the drawn precision is withheld and diagnosed, never printed (±0.02 at 1 dp must not read ±0.0)."
  detail: "Proposed."
  class: drafting
  source:
    adr: "archive 0019 §1 (Proposed)"
    issues: []
    tests: []
  status: ported
  rust_test: tests/tolerances.rs::ftc06_prints_the_authored_bands_as_draftwright_does
  rust_note: "Read as draftwright now formats a band (_fmt_tolerance: the drawn precision is a minimum and the authored digits are kept, so ±0.02 at 1 dp prints ±0.02, which is how draftwright settled the ±0.0 defect): only a band whose every magnitude is zero rounds to zero, and it is withheld with a tolerance_withheld warning on the dimension's ID. draftwright prints that band as ±0.0 (rust-correct: it states no tolerance)."
  port_note: "Keep: formatter rule plus Plan problem."

- id: ARCH0019-3
  statement: "A collapsed n× mark states a tolerance band only when every member states the same band at the drawn precision; otherwise the band is withheld with a diagnostic."
  detail: "Proposed; replaces three divergent implementations (pitch over jittered gaps, fillet first-authored-wins, ladder representative)."
  class: drafting
  source:
    adr: "archive 0019 §1 (Proposed)"
    issues: []
    tests: []
  status: ported
  rust_test: tests/tolerances.rs::ftc06_prints_the_authored_bands_as_draftwright_does
  rust_note: "src/dims/tolerance.rs: an n× callout states a fit only when every member it counts has the same one; otherwise it prints none and a tolerance_withheld warning names each member's fit (ctc01's hole pair, ftc06's bosses). A tolerance is keyed by the collapsed mark's own ID, so it is one band for the mark; a pattern's n× pitch is collapsed only from gaps equal within 1e-4 mm (src/dims/holes.rs), so its band holds of every gap. draftwright splits a group of bosses with different fits into separate callouts instead (ftc06: 3× ø44.5 and ø44.5 h6), listed rust-wrong in the test: splitting needs the boss and hole planners to group by fit."
  port_note: "Keep: collapse rule in the display-text formatter."

- id: ARCH0019-4
  statement: "Every mark the plan expects has an explicit outcome (placed, dropped with reason, or withheld with reason), reconciled at one seam, and a dropped mandatory mark is what fails the drawing."
  detail: "Proposed. Expected-mark table with a mandatory flag; per-mark identity (DimensionMarkId = dimension id + discriminator) is separate from the addressable dimension id so ladder rungs are accounted individually."
  class: trust
  source:
    adr: "archive 0019 §2-3 (Proposed); ADR 5 Open"
    issues: []
    tests: []
  status: pending
  port_note: "Keep (adopt): the Plan is naturally the expected-mark table; outcomes are per mark id."
  rust_test: tests/dimension_rules.rs::nothing_approved_vanishes_when_its_view_is_omitted
  rust_note: "In part: every plan item is placed, or unplaced with a problem naming it (view_plan_incomplete). Not ported: a mandatory flag, a per-mark identity apart from the dimension ID, and a dropped mandatory mark failing the drawing."

- id: ARCH0019-5
  statement: "The plan is compiled once per build under one recorded formatting policy, and consumers verify against that same plan."
  detail: "Proposed. Default policy 1 dp; RenderableDimensionPlan.policy self-describes; buildless consumers compile under the stated default. ADR 1 Open: compile_dimensions has ~32 call sites."
  class: trust
  source:
    adr: "archive 0019 §4 (Proposed); ADR 1 Open"
    issues: []
    tests: []
  status: pending
  port_note: "Keep: Plan header records formatting policy; render/lint read the Plan instead of recomputing."
  rust_note: "Not ported: the plan records no formatting policy. Labels are formatted once, by dims::fmt (draftwright's one decimal place), and drawn from the plan; lint reads the drawing."

- id: ARCH0020-1
  statement: "A rigid motion of the part should not change which features are recognised or which views are planned; framed recognition keeps records in the frame where they were proved."
  detail: "Source->local transforms treat points, vectors and scalars differently (points via to_local, vectors via basis only, scalars unchanged). Opt-in; raw remains the default pending platform and corpus canaries."
  class: trust
  source:
    adr: "archive 0020 Context, §2, §6; ADR 3 Open"
    issues: [1357]
    tests: ["test_issue_1357_framed_activation.py", "test_issue_1357_pmi_frame.py"]
  status: pending
  port_note: "Keep as target: rigid-motion invariance test over Analysis/Plan once quiddity-rust exposes framed preparation."
  rust_note: "Not ported here: quiddity-rust checks its recognisers under rigid motion, but no test plans a moved part and compares the Analysis's features and the plan's views; the port does not use framed recognition."

- id: ARCH0020-2
  statement: "Each turned body gets its own step chain anchored to its own silhouette: equal lengths on parallel shafts keep separate marks, and if no conflict-free lane exists a chain is dropped with a required-outcome diagnostic rather than drawn over a sibling."
  detail: "A sibling with equal shoulder stations cannot certify a missing chain."
  class: drafting
  source:
    adr: "archive 0020 §5"
    issues: [354]
    tests: ["test_issue_1357_plural_turned_profiles.py"]
  status: pending
  port_note: "Keep: planner per-body chain placement; Plan problem on drop."

- id: ARCH0020-3
  statement: "The caller's part remains source provenance and the working solid actually consumed is exposed separately; a frame refusal becomes a visible fallback decision at the product-policy level, never a hidden recovery inside the adapter."
  class: trust
  source:
    adr: "archive 0020 §4, §6"
    issues: [1357]
    tests: ["test_issue_1357_framed_activation.py"]
  status: pending
  port_note: "Keep: Analysis records source vs working geometry and any frame fallback decision."
  rust_note: "Not ported: the Analysis has one geometry (the STEP file's) and, with no framed recognition, no frame fallback decision to record."
