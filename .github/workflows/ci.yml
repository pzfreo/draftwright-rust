name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      DRAFTWRIGHT_CORPUS: ${{ github.workspace }}/quiddity/tests/corpus
      DRAFTWRIGHT_CORPUS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The corpus lives in the Python quiddity repository, pinned to a commit whose files match
      # the sha256 bindings of the recorded sheet facts and recognition fixtures; the toolchain
      # comes from rust-toolchain.toml.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release
