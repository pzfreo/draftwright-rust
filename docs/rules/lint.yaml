  status: pending
  rust_note: "Not ported (assessed in stream K5): draftwright derives these requirements from quiddity's PlanarOuterProfileEvidence, every planar face's ordered outer profile (lines and arcs), choosing the foremost camera-facing profile per body and view and leaving out corners a chamfer or regular-polygon callout defines (profile_angles.py). The Analysis carries no ordered outer profiles (principal_profiles keeps only principal boundary faces' unordered straight edges and arcs), so neither the planner nor lint can name a corner. Porting needs that evidence recorded at analysis time (new Analysis data, outside this stream's dimension-selection and lint scope), then angular items through dims::angular's placement and a profile_angle ledger in lint; it would add angles to every corpus part with a non-right outer corner (on draftwright's issue_909 case study, 51.1° and 128.9°)."
  port_note: "Keep."

- id: LINT-code-angular_label_vs_geometry
  statement: "An angular dimension's stated degrees agree with the angle between its reference rays."
  detail: "Error. Never uses the renderer's measured_angle as the expected answer. Labels with a degree mark or 'deg' are angular."
  class: drafting
  source:
    lint_code: "angular_label_vs_geometry"
    module: "linting/angular.py"
    issues: [1177]
    tests: [tests/test_angular_rendering.py, tests/test_angle_patterns.py]
  status: ported
  rust_test: "tests/lint_fidelity.rs::an_angle_states_the_degrees_between_its_rays"
  rust_note: "Stream K7, src/lint/fidelity.rs: the rays are read from the ink (the two extension lines, from where their carriers meet), never from the plan's angle; the leading nominal (after any quantity mark) must agree within half its last printed place. The port's angles are PMI records printed without a degree sign (60 ±0.5), which the drawing's angular ink, not its text, identifies, as draftwright's implicit_degree_label does."
  port_note: "Keep."

- id: LINT-code-angular_geometry_mismatch
  statement: "An angular dimension draws a circular arc with arrow tips and extension lines at both rays of its selected sector, from usable reference geometry."
  detail: "Error. Witness ink: a tip on the arc radius within 0.01 and a radial extension line straddling the ray beyond the arc. Also raised for unusable reference geometry or unreadable circular ink."
  class: drafting
  source:
    lint_code: "angular_geometry_mismatch"
    module: "linting/angular.py"
    issues: [1177]
    tests: [tests/test_angular_rendering.py, tests/test_canonical_angles.py]
  status: ported
  rust_test: "tests/lint_fidelity.rs::an_angle_draws_an_arc_about_its_vertex_with_extension_lines_past_it"
  rust_note: "Stream K7, src/lint/fidelity.rs: an angular dimension (a non-callout dimension whose ink is not linear) must have a vertex (non-parallel extension lines, a proper sector), arc chords about it at one radius (0.01 mm), none outside the sector, on both halves, the arc reaching each ray at its radius (draftwright's tip vertex), and each extension line along its ray past the arc. The port draws arcs as chords, so a chord's two ends stand for draftwright's circular edge."
  port_note: "Keep."

- id: LINT-code-angular_support_mismatch
  statement: "An angular dimension's rays correspond to the actual physical edges of the corner it claims, and a quantity mark (n×) on an angle accounts for that many distinct, equal physical corners."
  detail: "Error. Detected groups need the provider's repetition proof; authored groups must name one face's actual corners; imported requirements are validated against their typed support roster."
  class: drafting
  source:
    lint_code: "angular_support_mismatch"
    module: "linting/angular.py"
    issues: [1177]
    tests: [tests/test_angular_rendering.py, tests/test_canonical_angles.py]
  status: ported
  rust_test: "tests/lint_fidelity.rs::an_angles_rays_are_the_corners_physical_edges"
  rust_note: "Stream K7, src/lint/fidelity.rs, the drawn half: each ray must lie along a straight visible edge of its view (within 0.01 mm, on the ray's side of the vertex), the edges an angle's planar faces project to in the view that shows it true. draftwright compares the drawn witnesses with its registry's support roster; lint here reads only the drawing. A quantity mark on an angle is refused (one drawn corner cannot prove n): the port draws no counted angles (its angles are single PMI records), so detected and authored group proofs are not-applicable."
  port_note: "Keep."

- id: LINT-code-angular_support_unverifiable
