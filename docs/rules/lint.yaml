- id: LINT-quality-four_components
  statement: "Drawing quality is reported as four independent components (completeness, fidelity, legibility, restraint) and never composed into one score."
  detail: "Completeness is an audited_score over recognised requirements with a semantic ledger (excludes unrecognised geometry and families without a ledger; unavailable rather than 1.0 when nothing auditable was recognised). Restraint is reported unavailable until measurement provenance is complete. Fidelity is unavailable, not perfect, when the drawing asserts nothing."
  class: trust
  source:
    module: "linting/quality.py"
    issues: [1127, 1176]
    tests: [tests/test_quality_components.py, tests/test_issue_1176_quality_fidelity.py]
  status: pending
  port_note: "Keep the separation; decide scoring later."

- id: LINT-quality-fidelity_codes
  statement: "Findings meaning the drawing asserts something its source contradicts are classed as fidelity defects."
  detail: "label_vs_measured, scale_not_stated, angular_label_vs_geometry, angular_geometry_mismatch, angular_support_unverifiable, angular_support_mismatch, radius/diameter_leader_target_mismatch/_unverifiable, declared_feature_absent, gear_repeat_count_mismatch, gear_axis_mismatch, gear_requirement_mismatch, pmi_source_unknown, pmi_source_site_mismatch, pmi_source_text_mismatch, pmi_value_mismatch, step_general_tolerance_mismatch, step_material_mismatch, manufacturing_reference_unresolved, claimed_value_absent, claimed_measurement_not_compiled. Omissions (*_missing, *_dropped) are gaps, not falsehoods."
  class: trust
  source:
    module: "linting/quality.py"
    issues: [1176]
    tests: [tests/test_issue_1176_quality_fidelity.py]
  status: pending
  port_note: "Keep the classification as data."

- id: LINT-quality-legibility_codes
  statement: "Layout findings (overlaps, out-of-bounds, leader crossings, caption clearance, title overflow, view overlaps, page-fit and scale fallbacks) and placement drops are classed as legibility defects."
  detail: "Codes: legibility_floor_breached, page_fit_uncertain, layout_repack_stalled, scale_fallback_applied, annotation_out_of_bounds, title_field_overflow, annotation_overlap, annotation_ink_overlap, datum_leader_remote, detail_caption_clearance, derived_view_identifier_reused, detail_unplaceable, dim_inside_part, feature_leader_crossing, feature_leader_fixed_ink_unverified, interior_label_on_narrow_material, label_centerline_overlap, leader_crosses_silhouette, leader_shaft_unverified, leader_line_through_text, overall_dim_withheld, placement_unsatisfiable, view_annotation_inside_extents, view_annotation_overlap, view_out_of_bounds, view_overlap, plus any placement-stage drop. Fidelity takes precedence over legibility."
  class: trust
  source:
    module: "linting/quality.py"
    issues: [1127, 1147]
    tests: [tests/test_quality_components.py, tests/test_issue_1147_legibility_pair_aggregation.py]
  status: pending
  port_note: "Keep the classification as data."

- id: LINT-quality-hard_layout_codes
  statement: "Concrete page-bounds and ink-overlap defects at warning or error invalidate a settled page or scale before completeness is compared; leader/material crossings are a later tier."
  detail: "Hard: annotation_ink_overlap, annotation_out_of_bounds, annotation_overlap, detail_caption_clearance, feature_leader_fixed_ink_unverified, label_centerline_overlap, leader_line_through_text, title_field_overflow, view_annotation_overlap, view_out_of_bounds, view_overlap. Physical collision codes feature_leader_crossing and leader_crosses_silhouette veto even at info severity."
  class: drafting
  source:
    module: "linting/quality.py"
    issues: [1338]
    tests: [tests/test_issue_1338_scale_before_page_escalation.py]
  status: pending
  port_note: "Keep: used by page/scale escalation."

- id: LINT-quality-unscored_and_stage_routed
  statement: "Every emitted code belongs to exactly one register: fidelity, legibility, unscored, or stage-routed (a *_dropped code scored by its outcome stage)."
  detail: "Stage-routed: callout_dropped, gdt_dropped, pmi_dropped, boss_dia_dropped, blend_dropped, chamfer_dropped, circular_blind_step_dropped, circular_channel_dropped, hex_pocket_dropped, diameter_dropped, fillet_dropped, paired_ramp_step_dropped, flat_dropped, groove_dropped, gusset_rib_dropped, pad_height_dropped, pocket_dropped, polygonal_boss_dropped, polygonal_stock_dropped, rectangular_blind_slot_dropped, round_bottom_blind_slot_dropped, oriented_slot_dropped, slot_dropped, slot_dim_dropped. Unscored includes the coverage omissions, *_withheld codes, PMI census codes, plan_incomplete, section_dropped (validation stage), and every <family>_requirement_ prefix."
  class: machinery
  source:
    module: "linting/quality.py"
    issues: [1176]
    tests: [tests/test_issue_1176_quality_fidelity.py]
  status: pending
  port_note: "Adapt: an exhaustive Rust enum match makes this audit a compile-time check."

- id: LINT-quality-recognised_inventory_registers
  statement: "Every recognition inventory is either a requirement family, a permanent non-requirement inventory, or an explicitly undecided inventory surfaced at runtime."
  detail: "Non-requirement: countersinks, cylinders, section_recess_refusals, risers, rotational, step_levels. Undecided: circular_face_patterns, freeform_surfaces, interior_voids, oblique_through_steps, oriented_chamfers, oriented_slot_patterns, sheet_metal_bodies, thin_wall_bodies."
  class: trust
  source:
    module: "linting/quality.py"
    issues: [1365, 1430, 1557]
    tests: [tests/test_quality_components.py]
  status: pending
  port_note: "Keep the principle: no recognised inventory may silently join the blind spot."

# ---------------------------------------------------------------------------------------
# Orchestration and suggestions
# ---------------------------------------------------------------------------------------

- id: LINT-orchestration-finished_drawing_order
  statement: "Finished-drawing lint runs structural checks, then claimed-representation checks, then physical coverage (common, profiles, remaining), then PMI reconciliation, then manufacturing references, then appends build-time issues and attaches fix suggestions."
  detail: "Declared-model-only checks (declaration reconciliation, turned-profile span) run only for caller-declared models; structural lint runs once over all annotations with per-annotation scale so pairwise checks see across scale groups (#1216)."
  class: machinery
  source:
    module: "linting/orchestration.py"
    issues: [1928, 1216, 1204]
  status: pending
  port_note: "Adapt: keep a single ordered lint pipeline."

- id: LINT-suggest-fix_snippets
  statement: "Lint findings may carry a ready-to-paste fix hint in the public scripting API."
  detail: "Hints exist for feature_not_dimensioned, feature_count_mismatch, hole_requirement_missing, hole_requirement_unverifiable, annotation_ink_overlap, annotation_overlap, dim_inside_part, step_dim_dropped, plate_thickness_dropped, chamfer_dropped, step_position_dropped."
  class: machinery
  source:
    module: "linting/suggest.py"
    issues: [29]
    tests: [tests/test_lint_suggestions.py]
  status: pending
  port_note: "Drop or adapt to the Rust scripting surface."
